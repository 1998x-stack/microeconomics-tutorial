name: Static and browser quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pages, MathML, SVG and links
        run: python scripts/validate_site.py
      - name: Verify economic derivations
        run: python scripts/test_models.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser checks on desktop, tablet, mobile and print
        run: python scripts/browser_check.py
      - name: Save browser QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: reports/browser/
          if-no-files-found: ignore
