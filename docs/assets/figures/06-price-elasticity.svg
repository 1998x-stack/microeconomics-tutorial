<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e06a-title e06a-desc"><title id="e06a-title">线性需求上弹性变化</title><desc id="e06a-desc">Q等于120减去2P，价格20时数量80弹性0.5；价格30时数量60弹性1；价格40时数量40弹性2。</desc><rect width="880" height="450" fill="#fffefa"/><text x="36" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" fill="#24373b" text-anchor="start" font-weight="700">同一条直线，不同价格处的弹性不同</text><line x1="100" y1="365" x2="805" y2="365" stroke="#24373b" stroke-width="2" /><line x1="100" y1="365" x2="100" y2="66" stroke="#24373b" stroke-width="2" /><line x1="100" y1="293" x2="795" y2="293" stroke="#e5ece9" stroke-width="1" /><text x="83" y="298" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">10</text><line x1="100" y1="221" x2="795" y2="221" stroke="#e5ece9" stroke-width="1" /><text x="83" y="226" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">20</text><line x1="100" y1="149" x2="795" y2="149" stroke="#e5ece9" stroke-width="1" /><text x="83" y="154" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">30</text><line x1="100" y1="77" x2="795" y2="77" stroke="#e5ece9" stroke-width="1" /><text x="83" y="82" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">40</text><text x="804" y="405" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="end" font-weight="500">数量 Q（件）</text><text x="102" y="60" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="start" font-weight="500">价格 P（元）</text><polyline points="284,77 652,365" fill="none" stroke="#147f80" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="468" cy="221" r="8" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="483" y="209" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="700">A (80, 20)</text><text x="483" y="235" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="500">|ε| = 0.5</text><circle cx="376" cy="149" r="8" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="391" y="137" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="700">B (60, 30)</text><text x="391" y="163" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="500">|ε| = 1.0</text><circle cx="284" cy="77" r="8" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="299" y="65" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="700">C (40, 40)</text><text x="299" y="91" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="500">|ε| = 2.0</text><text x="532" y="321" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" fill="#147f80" text-anchor="start" font-weight="700">Q = 120 − 2P</text><text x="440" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="middle" font-weight="500">|ε| = 2P / Q；斜率固定，百分比响应却随价格改变。</text></svg>