<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e06b-title e06b-desc"><title id="e06b-title">不同价格下的总收入</title><desc id="e06b-desc">需求Q等于120减去2P，价格20销量80收入1600；价格30销量60收入1800；价格40销量40收入1600。</desc><rect width="880" height="450" fill="#fffefa"/><text x="37" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" fill="#24373b" text-anchor="start" font-weight="700">价格不一定越高，销售收入就越多</text><line x1="94" y1="357" x2="802" y2="357" stroke="#24373b" stroke-width="2" /><rect x="135" y="132.99999999999997" width="145" height="224.00000000000003" rx="8" fill="#147f80"/><text x="207" y="118.99999999999997" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#147f80" text-anchor="middle" font-weight="700">1600 元</text><text x="207" y="388" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#24373b" text-anchor="middle" font-weight="500">P=20，Q=80</text><text x="207" y="413" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="middle" font-weight="500">|ε|=0.5</text><rect x="370" y="104.99999999999997" width="145" height="252.00000000000003" rx="8" fill="#7461ba"/><text x="442" y="90.99999999999997" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#7461ba" text-anchor="middle" font-weight="700">1800 元</text><text x="442" y="388" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#24373b" text-anchor="middle" font-weight="500">P=30，Q=60</text><text x="442" y="413" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="middle" font-weight="500">|ε|=1.0</text><rect x="605" y="132.99999999999997" width="145" height="224.00000000000003" rx="8" fill="#147f80"/><text x="677" y="118.99999999999997" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#147f80" text-anchor="middle" font-weight="700">1600 元</text><text x="677" y="388" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#24373b" text-anchor="middle" font-weight="500">P=40，Q=40</text><text x="677" y="413" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="middle" font-weight="500">|ε|=2.0</text><text x="525" y="84" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="500">TR = P × Q</text><text x="526" y="111" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="start" font-weight="500">此图仅表示沿同一需求曲线移动。</text></svg>