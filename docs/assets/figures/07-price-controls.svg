<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e07a-title e07a-desc"><title id="e07a-title">有约束力的最高价和最低价</title><desc id="e07a-desc">初始市场均衡价格20数量80。上限15时需求90供给65短缺25，下限25时需求70供给95过剩25。</desc><rect width="880" height="450" fill="#fffefa"/><text x="35" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" fill="#24373b" text-anchor="start" font-weight="700">同一市场中，有约束力的价格上限与下限</text><rect x="35" y="65" width="395" height="324" rx="8" fill="#f4f8f6"/><line x1="93" y1="332" x2="395" y2="332" stroke="#24373b" stroke-width="2" /><line x1="93" y1="332" x2="93" y2="99" stroke="#24373b" stroke-width="2" /><text x="53" y="91" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#147f80" text-anchor="start" font-weight="700">价格上限 P=15</text><polyline points="173,104 333,332" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polyline points="133,332 373,104" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="93" y1="246.5" x2="393" y2="246.5" stroke="#7461ba" stroke-width="2.6" stroke-dasharray="7 5"/><circle cx="273" cy="246.5" r="7" fill="#fffefa" stroke="#147f80" stroke-width="3"/><circle cx="223" cy="246.5" r="7" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="223" y="352" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">65</text><text x="273" y="352" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">90</text><line x1="273" y1="255.5" x2="223" y2="255.5" stroke="#7461ba" stroke-width="4" /><text x="232" y="380" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#7461ba" text-anchor="middle" font-weight="700">差额 25 件</text><rect x="449" y="65" width="395" height="324" rx="8" fill="#f4f8f6"/><line x1="507" y1="332" x2="809" y2="332" stroke="#24373b" stroke-width="2" /><line x1="507" y1="332" x2="507" y2="99" stroke="#24373b" stroke-width="2" /><text x="467" y="91" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#d06d4d" text-anchor="start" font-weight="700">价格下限 P=25</text><polyline points="587,104 747,332" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polyline points="547,332 787,104" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="507" y1="189.5" x2="807" y2="189.5" stroke="#7461ba" stroke-width="2.6" stroke-dasharray="7 5"/><circle cx="647" cy="189.5" r="7" fill="#fffefa" stroke="#147f80" stroke-width="3"/><circle cx="697" cy="189.5" r="7" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="647" y="352" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">70</text><text x="697" y="352" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">95</text><line x1="647" y1="198.5" x2="697" y2="198.5" stroke="#7461ba" stroke-width="4" /><text x="646" y="380" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#7461ba" text-anchor="middle" font-weight="700">差额 25 件</text><text x="440" y="433" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">低于均衡的上限 → 短缺；高于均衡的下限 → 过剩。</text></svg>