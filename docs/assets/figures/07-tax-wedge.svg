<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e07b-title e07b-desc"><title id="e07b-title">单位税引起税楔和交易数量下降</title><desc id="e07b-desc">税前均衡P20Q80，征税每件5后消费者付23，生产者得18，成交量74，政府税收370，三角形无谓损失15。</desc><rect width="880" height="450" fill="#fffefa"/><text x="36" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" fill="#24373b" text-anchor="start" font-weight="700">每件税收 t=5：买家付23，卖家收18</text><line x1="100" y1="365" x2="805" y2="365" stroke="#24373b" stroke-width="2" /><line x1="100" y1="365" x2="100" y2="66" stroke="#24373b" stroke-width="2" /><line x1="100" y1="293" x2="795" y2="293" stroke="#e5ece9" stroke-width="1" /><text x="83" y="298" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">10</text><line x1="100" y1="221" x2="795" y2="221" stroke="#e5ece9" stroke-width="1" /><text x="83" y="226" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">20</text><line x1="100" y1="149" x2="795" y2="149" stroke="#e5ece9" stroke-width="1" /><text x="83" y="154" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">30</text><line x1="100" y1="77" x2="795" y2="77" stroke="#e5ece9" stroke-width="1" /><text x="83" y="82" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end" font-weight="500">40</text><text x="804" y="405" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="end" font-weight="500">数量 Q（件）</text><text x="102" y="60" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="start" font-weight="500">价格 P（元）</text><polyline points="284,77 652,365" fill="none" stroke="#147f80" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round" /><polyline points="192,365 744,77" fill="none" stroke="#d06d4d" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round" /><polygon points="440.4,199.4 440.4,235.4 468,221" fill="#ebe8f7" opacity="0.92"/><line x1="440.4" y1="199.4" x2="440.4" y2="235.4" stroke="#7461ba" stroke-width="5" /><circle cx="440.4" cy="199.4" r="7" fill="#fffefa" stroke="#147f80" stroke-width="3"/><circle cx="440.4" cy="235.4" r="7" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><circle cx="468" cy="221" r="6" fill="#fffefa" stroke="#9aa9a7" stroke-width="3"/><line x1="468" y1="221" x2="468" y2="365" stroke="#9eaaa7" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="440.4" y1="199.4" x2="100" y2="199.4" stroke="#147f80" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="440.4" y1="235.4" x2="100" y2="235.4" stroke="#d06d4d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="463.4" y="184.4" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#147f80" text-anchor="start" font-weight="700">Pc = 23</text><text x="463.4" y="257.4" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#d06d4d" text-anchor="start" font-weight="700">Pp = 18</text><text x="478.4" y="216" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#7461ba" text-anchor="start" font-weight="700">t = 5</text><text x="675" y="113" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#617479" text-anchor="end" font-weight="500">税前 E₀: (80,20)</text><text x="675" y="140" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#7461ba" text-anchor="end" font-weight="700">税后 Q=74</text><text x="460" y="425" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">税收收入 5×74=370；静态无谓损失 (80−74)×5/2=15。</text></svg>