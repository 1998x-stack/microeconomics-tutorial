<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e08b-title e08b-desc"><title id="e08b-title">效用最大化的预算例子</title><desc id="e08b-desc">预算2x加y等于12、效用U等于根号xy，最佳内点消费束为x3 y6，效用根号18约4.243，(2,8)和(4,4)均效用4。</desc><rect width="880" height="450" fill="#fffefa"/><text x="38" y="39" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">每元边际效用相等：预算最优组合（可微、内点解）</text><line x1="116" y1="352" x2="802" y2="352" stroke="#24373b" stroke-width="2" /><line x1="116" y1="352" x2="116" y2="61" stroke="#24373b" stroke-width="2" /><polyline points="116,100 644,352" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="292" cy="184" r="8" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="306" y="176" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#d06d4d" text-anchor="start" font-weight="700">(2, 8)</text><circle cx="380" cy="226" r="8" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="394" y="218" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#7461ba" text-anchor="start" font-weight="700">(3, 6)</text><circle cx="468" cy="268" r="8" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="482" y="260" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#147f80" text-anchor="start" font-weight="700">(4, 4)</text><text x="506" y="91" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#147f80" text-anchor="start" font-weight="500">预算 2x + y = 12</text><text x="506" y="125" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" fill="#7461ba" text-anchor="start" font-weight="500">偏好 U = √(xy)</text><text x="506" y="158" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#7461ba" text-anchor="start" font-weight="500">最优 A=(3,6)，U≈4.243</text><text x="790" y="391" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="end" font-weight="500">x 数量</text><text x="117" y="60" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="start" font-weight="500">y 数量</text></svg>