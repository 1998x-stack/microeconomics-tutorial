<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e08a-title e08a-desc"><title id="e08a-title">总效用和递减的边际效用</title><desc id="e08a-desc">总效用TU等于12x减x平方，从消费0到6单位效用依次0、11、20、27、32、35、36；边际效用依次为11、9、7、5、3、1。</desc><rect width="880" height="450" fill="#fffefa"/><text x="37" y="39" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">总效用可以增加，但每一单位带来的新增效用递减</text><line x1="84" y1="348" x2="802" y2="348" stroke="#24373b" stroke-width="2" /><line x1="84" y1="348" x2="84" y2="79" stroke="#24373b" stroke-width="2" /><text x="84" y="67" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="start" font-weight="500">效用（任意单位）</text><polyline points="84,348 183,271 282,208 381,159 480,124 579,103 678,96" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="84" cy="348" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="84" y="337" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="middle" font-weight="500">0</text><text x="84" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">0</text><circle cx="183" cy="271" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="183" y="260" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="middle" font-weight="500">11</text><text x="183" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">1</text><circle cx="282" cy="208" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="282" y="197" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="middle" font-weight="500">20</text><text x="282" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">2</text><circle cx="381" cy="159" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="381" y="148" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="middle" font-weight="500">27</text><text x="381" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">3</text><circle cx="480" cy="124" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="480" y="113" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="middle" font-weight="500">32</text><text x="480" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">4</text><circle cx="579" cy="103" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="579" y="92" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="middle" font-weight="500">35</text><text x="579" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">5</text><circle cx="678" cy="96" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="678" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="middle" font-weight="500">36</text><text x="678" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#617479" text-anchor="middle" font-weight="500">6</text><text x="771" y="415" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="end" font-weight="500">商品消费单位 x</text><text x="408" y="132" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" fill="#147f80" text-anchor="start" font-weight="700">TU = 12x − x²</text><text x="422" y="159" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#d06d4d" text-anchor="start" font-weight="500">从 x=1 到 6，MU = 11, 9, 7, 5, 3, 1</text></svg>