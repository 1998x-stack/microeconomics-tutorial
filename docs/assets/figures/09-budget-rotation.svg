<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e09b-title e09b-desc"><title id="e09b-title">价格下降使预算线旋转</title><desc id="e09b-desc">收入12和y价格1不变，x商品价格由2降为1，预算线从2x+y等于12变为x+y等于12；Cobb Douglas最优束从(3,6)变成(6,6)。</desc><rect width="880" height="450" fill="#fffefa"/><text x="38" y="38" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">x 商品降价：预算线绕 y 轴截距向外旋转</text><line x1="118" y1="356" x2="798" y2="356" stroke="#24373b" stroke-width="2" /><line x1="118" y1="356" x2="118" y2="59" stroke="#24373b" stroke-width="2" /><polyline points="118,104 646,356" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polyline points="118,104 1174,356" fill="none" stroke="#d06d4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="382" cy="230" r="8" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="400" y="257" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#147f80" text-anchor="start" font-weight="700">A (3,6)</text><circle cx="646" cy="230" r="8" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="664" y="257" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#d06d4d" text-anchor="start" font-weight="700">C (6,6)</text><text x="170" y="92" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#147f80" text-anchor="start" font-weight="500">旧：2x + y = 12</text><text x="440" y="92" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#d06d4d" text-anchor="start" font-weight="500">新：x + y = 12</text><text x="560" y="133" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#7461ba" text-anchor="start" font-weight="500">U: √18 → 6</text><text x="783" y="408" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="end" font-weight="500">x 商品数量</text><text x="117" y="56" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="start" font-weight="500">y 商品数量</text></svg>