<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e09b-title e09b-desc"><title id="e09b-title">X商品降价使预算线旋转</title><desc id="e09b-desc">收入12和Y价格1不变，X价格从2降至1，预算从2x+y等于12转为x+y等于12，最优从A3,6转到C6,6。</desc><rect width="880" height="450" fill="#fffefa"/><text x="35" y="40" font-family="Arial,Microsoft YaHei,sans-serif" fill="#24373b" font-size="21" font-weight="700" text-anchor="start">X 降价：预算线绕 Y 轴截距向外旋转</text><line x1="132" y1="356" x2="789" y2="356" stroke="#24373b" stroke-width="2" /><line x1="132" y1="356" x2="132" y2="68" stroke="#24373b" stroke-width="2" /><polyline fill="none" stroke="#147f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  points="132,116 432,356"/><polyline fill="none" stroke="#d06d4d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  points="132,116 732,356"/><circle cx="282" cy="236" r="7" fill="#fffefa" stroke="#147f80" stroke-width="3"/><circle cx="432" cy="236" r="7" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="293" y="222" font-family="Arial,Microsoft YaHei,sans-serif" fill="#147f80" font-size="16" font-weight="700" text-anchor="start">A (3,6)</text><text x="444" y="222" font-family="Arial,Microsoft YaHei,sans-serif" fill="#d06d4d" font-size="16" font-weight="700" text-anchor="start">C (6,6)</text><text x="150" y="92" font-family="Arial,Microsoft YaHei,sans-serif" fill="#147f80" font-size="18" font-weight="500" text-anchor="start">旧预算：2x + y = 12</text><text x="491" y="92" font-family="Arial,Microsoft YaHei,sans-serif" fill="#d06d4d" font-size="18" font-weight="500" text-anchor="start">新预算：x + y = 12</text><text x="506" y="135" font-family="Arial,Microsoft YaHei,sans-serif" fill="#7461ba" font-size="18" font-weight="500" text-anchor="start">U: √18 → 6</text><text x="786" y="401" font-family="Arial,Microsoft YaHei,sans-serif" fill="#617479" font-size="15" font-weight="500" text-anchor="end">X 商品数量</text><text x="132" y="62" font-family="Arial,Microsoft YaHei,sans-serif" fill="#617479" font-size="15" font-weight="500" text-anchor="start">Y 商品数量</text><text x="432" y="373" font-family="Arial,Microsoft YaHei,sans-serif" fill="#617479" font-size="13" font-weight="500" text-anchor="middle">6</text><text x="732" y="373" font-family="Arial,Microsoft YaHei,sans-serif" fill="#617479" font-size="13" font-weight="500" text-anchor="middle">12</text><text x="119" y="120" font-family="Arial,Microsoft YaHei,sans-serif" fill="#617479" font-size="13" font-weight="500" text-anchor="end">12</text></svg>