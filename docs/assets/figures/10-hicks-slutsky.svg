<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="e10b-title e10b-desc"><title id="e10b-title">希克斯与斯勒茨基分解的差别</title><desc id="e10b-desc">旧消费x为3，新消费x为6。Hicks中间点x等于根号18约4.243，替代效应约1.243收入效应约1.757。Slutsky中间点4.5，两个效应分别1.5和1.5。</desc><rect width="880" height="450" fill="#fffefa"/><text x="37" y="36" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" fill="#24373b" text-anchor="start" font-weight="700">两种补偿法，都把总需求变化拆开</text><rect x="43" y="65" width="392" height="317" rx="8" fill="#f2f7f5"/><text x="66" y="98" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#24373b" text-anchor="start" font-weight="700">Hicks · 保持原效用</text><line x1="79" y1="283" x2="397" y2="283" stroke="#24373b" stroke-width="2" /><line x1="151" y1="277" x2="151" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="151" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">3</text><line x1="209" y1="277" x2="209" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="209" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">4</text><line x1="267" y1="277" x2="267" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="267" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">5</text><line x1="325" y1="277" x2="325" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="325" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">6</text><line x1="151" y1="194" x2="223.0731598529185" y2="194" stroke="#147f80" stroke-width="7" /><line x1="223.0731598529185" y1="222" x2="325" y2="222" stroke="#d06d4d" stroke-width="7" /><circle cx="151" cy="194" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><circle cx="223.0731598529185" cy="194" r="6" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><circle cx="325" cy="222" r="5" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="65" y="144" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#147f80" text-anchor="start" font-weight="500">替代效应：+1.243</text><text x="65" y="171" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#d06d4d" text-anchor="start" font-weight="500">收入效应：+1.757</text><text x="65" y="347" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="700">A=3 → B=4.243 → C=6</text><text x="65" y="368" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="start" font-weight="500">原效用 √18</text><rect x="459" y="65" width="392" height="317" rx="8" fill="#f2f7f5"/><text x="482" y="98" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#24373b" text-anchor="start" font-weight="700">Slutsky · 买得起旧篮子</text><line x1="495" y1="283" x2="813" y2="283" stroke="#24373b" stroke-width="2" /><line x1="567" y1="277" x2="567" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="567" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">3</text><line x1="625" y1="277" x2="625" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="625" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">4</text><line x1="683" y1="277" x2="683" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="683" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">5</text><line x1="741" y1="277" x2="741" y2="290" stroke="#24373b" stroke-width="1.4" /><text x="741" y="311" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle" font-weight="500">6</text><line x1="567" y1="194" x2="654" y2="194" stroke="#147f80" stroke-width="7" /><line x1="654" y1="222" x2="741" y2="222" stroke="#d06d4d" stroke-width="7" /><circle cx="567" cy="194" r="5" fill="#fffefa" stroke="#147f80" stroke-width="3"/><circle cx="654" cy="194" r="6" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><circle cx="741" cy="222" r="5" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="481" y="144" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#147f80" text-anchor="start" font-weight="500">替代效应：+1.500</text><text x="481" y="171" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#d06d4d" text-anchor="start" font-weight="500">收入效应：+1.500</text><text x="481" y="347" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="start" font-weight="700">A=3 → B=4.500 → C=6</text><text x="481" y="368" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="start" font-weight="500">旧篮子花费 9</text><text x="440" y="423" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="middle" font-weight="500">两种分解的中间点不同，但总效应都是 Δx = +3。</text></svg>