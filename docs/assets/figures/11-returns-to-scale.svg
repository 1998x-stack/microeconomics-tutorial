<text x="450" y="404" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#617479" text-anchor="middle">规模因子 λ（如 2 表示所有投入翻倍）　纵轴：产出倍数（原规模产出 = 1）</text><text x="450" y="424" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">教学示例取 Q=L^a·K^a，指数和为 2a；曲线弯曲方向由指数和决定。</text></svg>
