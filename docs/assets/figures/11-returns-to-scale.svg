<text x="256" y="298" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#24373b" text-anchor="start" font-weight="700">λ=1：三条线都从这里出发</text>
<text x="795" y="86" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#d06d4d" text-anchor="end" font-weight="700">递增：λ^1.4 &gt; λ</text><text x="795" y="182" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="end" font-weight="700">不变：λ^1.0 = λ</text><text x="795" y="243" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#7461ba" text-anchor="end" font-weight="700">递减：λ^0.6 &lt; λ</text>
