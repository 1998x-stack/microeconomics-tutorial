<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="c11b-title c11b-desc"><title id="c11b-title">规模报酬的三种可能</title><desc id="c11b-desc">把所有投入放大 λ 倍时，产出倍数随技术而变：指数和大于 1 时产出增长快于 λ，等于 1 时与 λ 成正比，小于 1 时慢于 λ。三条曲线都经过 λ=1、产出倍数=1 的点。</desc><rect width="880" height="430" fill="#fffefa"/><text x="36" y="32" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">所有投入放大 λ 倍，产出会变成多少？</text>
<line x1="100" y1="360" x2="800" y2="360" stroke="#24373b" stroke-width="2"/><line x1="100" y1="360" x2="100" y2="70" stroke="#24373b" stroke-width="2"/><line x1="100" y1="302" x2="800" y2="302" stroke="#e5ece9" stroke-width="1"/><line x1="100" y1="244" x2="800" y2="244" stroke="#e5ece9" stroke-width="1"/><line x1="100" y1="186" x2="800" y2="186" stroke="#e5ece9" stroke-width="1"/><line x1="100" y1="128" x2="800" y2="128" stroke="#e5ece9" stroke-width="1"/><line x1="100" y1="70" x2="800" y2="70" stroke="#e5ece9" stroke-width="1"/>
