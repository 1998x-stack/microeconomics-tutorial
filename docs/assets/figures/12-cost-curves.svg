<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="c12b-title c12b-desc"><title id="c12b-title">短期成本曲线：总量与单位量</title><desc id="c12b-desc">上半图总固定成本为水平线，总可变成本与总成本随产量上升且越来越陡；下半图平均固定成本持续下降，平均可变成本与平均总成本为 U 形，边际成本先降后升，并依次穿过平均可变成本与平均总成本的最低点。</desc><rect width="880" height="500" fill="#fffefa"/><text x="36" y="28" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">短期成本曲线：MC 穿过 AVC 与 ATC 的最低点</text>
