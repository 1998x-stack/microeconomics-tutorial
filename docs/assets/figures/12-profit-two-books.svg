<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="c12a-title c12a-desc"><title id="c12a-title">同一笔收益，两本账：会计视角与经济视角</title><desc id="c12a-desc">总收益均为 50 万元。会计口径扣除显性成本 40 后得会计利润 10；经济学口径再扣隐性成本 17，成本合计 57，超过收益 7，即经济利润 −7。</desc><rect width="880" height="430" fill="#fffefa"/><text x="36" y="32" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">同一笔收益，两本账（单位：万元/年）</text>
<line x1="110" y1="400" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><text x="102" y="405" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">0</text><text x="102" y="295" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><text x="102" y="185" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text>
<line x1="110" y1="125" x2="800" y2="125" stroke="#7461ba" stroke-width="2.4" stroke-dasharray="9 6"/><text x="800" y="118" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="end" font-weight="700">总收益 = 50</text>
<rect x="170" y="180" width="150" height="220" fill="#147f80"/><rect x="170" y="125" width="150" height="55" fill="#7461ba"/>
<text x="245" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">显性成本 40</text><text x="245" y="157" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">会计利润 10</text><text x="245" y="112" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#24373b" text-anchor="middle" font-weight="700">会计视角</text>
<rect x="560" y="180" width="150" height="220" fill="#147f80"/><rect x="560" y="86.5" width="150" height="93.5" fill="#d06d4d"/><rect x="560" y="86.5" width="150" height="38.5" fill="#c0392b" fill-opacity="0.30"/><rect x="560" y="86.5" width="150" height="38.5" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="635" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">显性成本 40</text><text x="635" y="168" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">隐性成本 17</text><text x="635" y="80" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#24373b" text-anchor="middle" font-weight="700">经济学视角</text>
<text x="722" y="103" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">经济利润 −7</text><text x="722" y="123" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="start">成本超出收益的部分</text>
<text x="450" y="424" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">教学示例：显性成本 40（原材料 12+房租 10+工资 15+水电 3），隐性成本 17（自有资金机会 2+店主时间机会 15）。</text></svg>
