<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c13a-title c13a-desc"><title id="c13a-title">完全竞争企业的利润最大化与亏损</title><desc id="c13a-desc">价格为 40 时，边际成本曲线在 Q=2 处等于价格，这是利润最大化的产量；此时平均总成本 130 高于价格，企业亏损 180，但因价格高于平均可变成本 20，短期内仍应生产。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">P = MR = MC 定产量，但未必盈利（教学示例）</text>
<line x1="100" y1="420" x2="800" y2="420" stroke="#24373b" stroke-width="2"/><line x1="100" y1="420" x2="100" y2="60" stroke="#24373b" stroke-width="2"/><line x1="100" y1="330" x2="800" y2="330" stroke="#e5ece9" stroke-width="1"/><text x="92" y="335" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="100" y1="240" x2="800" y2="240" stroke="#e5ece9" stroke-width="1"/><text x="92" y="245" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><line x1="100" y1="150" x2="800" y2="150" stroke="#e5ece9" stroke-width="1"/><text x="92" y="155" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">120</text>
<polyline points="100.0,375.0 135.0,363.8 170.0,352.5 205.0,341.2 240.0,330.0 275.0,318.8 310.0,307.5 345.0,296.2 380.0,285.0 415.0,273.8 450.0,262.5 485.0,251.2 520.0,240.0 555.0,228.8 590.0,217.5 625.0,206.2 660.0,195.0 695.0,183.8 730.0,172.5 765.0,161.2 800.0,150.0" fill="none" stroke="#d06d4d" stroke-width="3.2" stroke-linecap="round"/><text x="792" y="145" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="end" font-weight="700">MC = 20 + 10Q</text>
<polyline points="100.0,375.0 135.0,369.4 170.0,363.8 205.0,358.1 240.0,352.5 275.0,346.9 310.0,341.2 345.0,335.6 380.0,330.0 415.0,324.4 450.0,318.8 485.0,313.1 520.0,307.5 555.0,301.9 590.0,296.2 625.0,290.6 660.0,285.0 695.0,279.4 730.0,273.8 765.0,268.1 800.0,262.5" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><text x="792" y="258" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="end" font-weight="700">AVC = 20 + 5Q</text>
<polyline points="254.0,145.7 271.5,163.8 289.0,178.0 306.5,189.3 324.0,198.4 341.5,205.8 359.0,211.8 376.5,216.6 394.0,220.6 411.5,223.8 429.0,226.4 446.5,228.4 464.0,230.0 481.5,231.1 499.0,231.9 516.5,232.4 534.0,232.7 551.5,232.7 569.0,232.5 586.5,232.1 604.0,231.5 621.5,230.8 639.0,229.9 656.5,229.0 674.0,227.9 691.5,226.7 709.0,225.4 726.5,224.0 744.0,222.6 761.5,221.1 779.0,219.5 796.5,217.8" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round"/><text x="792" y="213" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="end" font-weight="700">ATC</text>
<rect x="100" y="127.5" width="140" height="202.5" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="100" y1="330" x2="800" y2="330" stroke="#24373b" stroke-width="2.2" stroke-dasharray="9 6"/><text x="110" y="323" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#24373b" text-anchor="start" font-weight="700">P = MR = 40</text>
<circle cx="240" cy="330" r="6.5" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="252" y="346" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="start" font-weight="700">Q* = 2（MC = P）</text>
<circle cx="100" cy="375" r="5.5" fill="#fffefa" stroke="#147f80" stroke-width="2.6"/><text x="110" y="392" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#147f80" text-anchor="start" font-weight="700">停业价 = AVC 最低 = 20</text>
<text x="252" y="240" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#c0392b" text-anchor="start" font-weight="700">亏损 = (ATC − P) × Q</text><text x="252" y="258" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="start">= (130 − 40) × 2 = 180</text>
<text x="100" y="436" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="240" y="436" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">2</text><text x="380" y="436" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">4</text><text x="520" y="436" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">6</text><text x="660" y="436" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">8</text><text x="800" y="436" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">10</text><text x="450" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">产量 Q（件）；价格与成本（元/件）。教学示例：TC=200+20Q+5Q²</text></svg>
