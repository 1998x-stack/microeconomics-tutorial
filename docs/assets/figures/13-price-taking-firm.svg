<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="fig13a-title fig13a-desc"><title id="fig13a-title">竞争行业与单个企业的需求曲线</title><desc id="fig13a-desc">行业需求向下倾斜，行业供需决定市场价格；单个价格接受企业面对在市场价格处的水平需求线。</desc><rect width="880" height="450" fill="#fffefa"/><text x="35" y="38" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#24373b" font-size="20" font-weight="700" text-anchor="start">行业需求决定价格；单个企业把价格视为给定</text><line x1="85" y1="355" x2="405" y2="355" stroke="#8c9a99" stroke-width="2" /><line x1="85" y1="355" x2="85" y2="75" stroke="#8c9a99" stroke-width="2" /><line x1="485" y1="355" x2="810" y2="355" stroke="#8c9a99" stroke-width="2" /><line x1="485" y1="355" x2="485" y2="75" stroke="#8c9a99" stroke-width="2" /><polyline points="100.0,95.0 390.0,325.0" fill="none" stroke="#d06d4d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><polyline points="500.0,220.0 800.0,220.0" fill="none" stroke="#147f80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="245" cy="210" r="6" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="250" y="194" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#d06d4d" font-size="14" font-weight="500" text-anchor="start">E*：市场价格 P*</text><line x1="485" y1="220" x2="810" y2="220" stroke="#7461ba" stroke-width="1.8" stroke-dasharray="5 5"/><text x="95" y="68" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#d06d4d" font-size="15" font-weight="500" text-anchor="start">行业：向下倾斜的需求</text><text x="495" y="68" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#147f80" font-size="15" font-weight="500" text-anchor="start">企业：水平需求 P=MR=AR</text><text x="795" y="394" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="14" font-weight="500" text-anchor="end">市场数量 Q</text><text x="485" y="416" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="14" font-weight="500" text-anchor="end">企业产量 q</text></svg>