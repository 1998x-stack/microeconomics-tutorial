<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="c13b-title c13b-desc"><title id="c13b-title">短期供给曲线与三种价格情形</title><desc id="c13b-desc">完全竞争企业的短期供给曲线是平均可变成本最低点以上的边际成本曲线。价格高于平均总成本时盈利，介于平均可变成本与平均总成本之间时亏损但仍生产，低于平均可变成本最低点时停产。</desc><rect width="880" height="430" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">短期供给曲线 = AVC 最低点以上的 MC（教学示例）</text>
<line x1="100" y1="380" x2="800" y2="380" stroke="#24373b" stroke-width="2"/><line x1="100" y1="380" x2="100" y2="60" stroke="#24373b" stroke-width="2"/><line x1="100" y1="273.3" x2="800" y2="273.3" stroke="#e5ece9" stroke-width="1"/><text x="92" y="278" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="100" y1="166.7" x2="800" y2="166.7" stroke="#e5ece9" stroke-width="1"/><text x="92" y="171" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><text x="92" y="65" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">120</text>
<polyline points="100.0,326.7 135.0,313.3 170.0,300.0 205.0,286.7 240.0,273.3 275.0,260.0 310.0,246.7 345.0,233.3 380.0,220.0 415.0,206.7 450.0,193.3 485.0,180.0 520.0,166.7 555.0,153.3 590.0,140.0 625.0,126.7 660.0,113.3 695.0,100.0 730.0,86.7 765.0,73.3 800.0,60.0" fill="none" stroke="#d06d4d" stroke-width="4.4" stroke-linecap="round"/><text x="600" y="106" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="middle" font-weight="700">MC（供给曲线）</text>
<polyline points="100.0,326.7 135.0,320.0 170.0,313.3 205.0,306.7 240.0,300.0 275.0,293.3 310.0,286.7 345.0,280.0 380.0,273.3 415.0,266.7 450.0,260.0 485.0,253.3 520.0,246.7 555.0,240.0 590.0,233.3 625.0,226.7 660.0,220.0 695.0,213.3 730.0,206.7 765.0,200.0 800.0,193.3" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><text x="792" y="189" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="end" font-weight="700">AVC</text>
<polyline points="324.0,117.3 341.5,126.1 359.0,133.2 376.5,139.0 394.0,143.7 411.5,147.5 429.0,150.5 446.5,152.9 464.0,154.8 481.5,156.1 499.0,157.1 516.5,157.7 534.0,158.0 551.5,158.0 569.0,157.7 586.5,157.3 604.0,156.6 621.5,155.7 639.0,154.7 656.5,153.6 674.0,152.3 691.5,150.9 709.0,149.4 726.5,147.7 744.0,146.0 761.5,144.2 779.0,142.4 796.5,140.4" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round"/><text x="560" y="166" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="middle" font-weight="700">ATC（最低 ≈83.2）</text>
<line x1="100" y1="113.3" x2="800" y2="113.3" stroke="#2f855a" stroke-width="2.2" stroke-dasharray="9 6"/><text x="110" y="106" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#2f855a" text-anchor="start" font-weight="700">P = 100 &gt; ATC：盈利，Q = 8</text>
<line x1="100" y1="220" x2="800" y2="220" stroke="#b7791f" stroke-width="2.2" stroke-dasharray="9 6"/><text x="110" y="213" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="start" font-weight="700">P = 60（AVC &lt; P &lt; ATC）：亏损但继续，Q = 4</text>
<line x1="100" y1="340" x2="800" y2="340" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="9 6"/><text x="110" y="333" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">P = 15 &lt; 停业价 20：停产，Q = 0</text>
<circle cx="660" cy="113.3" r="6" fill="#fffefa" stroke="#2f855a" stroke-width="3"/><circle cx="380" cy="220" r="6" fill="#fffefa" stroke="#b7791f" stroke-width="3"/><circle cx="100" cy="326.7" r="5.5" fill="#fffefa" stroke="#147f80" stroke-width="2.6"/><text x="110" y="322" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#147f80" text-anchor="start" font-weight="700">停业价 = AVC 最低 = 20</text>
<text x="100" y="396" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="240" y="396" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">2</text><text x="380" y="396" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">4</text><text x="520" y="396" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">6</text><text x="660" y="396" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">8</text><text x="800" y="396" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">10</text><text x="450" y="420" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">产量 Q（件）；价格与成本（元/件）。教学示例：TC=200+20Q+5Q²</text></svg>
