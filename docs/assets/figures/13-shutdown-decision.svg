<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="fig13b-title fig13b-desc"><title id="fig13b-title">价格与短期关停决策区间</title><desc id="fig13b-desc">价格低于最低平均可变成本时停产；高于最低AVC但低于最低ATC时继续生产但亏损；高于ATC时获得正经济利润。</desc><rect width="880" height="450" fill="#fffefa"/><text x="35" y="40" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#24373b" font-size="20" font-weight="700" text-anchor="start">短期决策取决于市场价格相对 AVC 与 ATC 的位置</text><line x1="110" y1="330" x2="780" y2="330" stroke="#8c9a99" stroke-width="2" /><line x1="110" y1="330" x2="110" y2="95" stroke="#8c9a99" stroke-width="2" /><rect x="120" y="130" width="190" height="145" rx="9" fill="#f6e4df" stroke="#d06d4d"/><rect x="320" y="130" width="245" height="145" rx="9" fill="#f5efd9" stroke="#b28b43"/><rect x="575" y="130" width="190" height="145" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="215" y="165" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#a34c34" font-size="18" font-weight="700" text-anchor="middle">P &lt; min AVC</text><text x="215" y="198" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#a34c34" font-size="18" font-weight="700" text-anchor="middle">停产</text><text x="215" y="230" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#8b6659" font-size="13" font-weight="500" text-anchor="middle">只承担短期固定成本</text><text x="442" y="165" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#8a6928" font-size="15" font-weight="700" text-anchor="middle">min AVC &lt; P &lt; min ATC</text><text x="442" y="198" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#8a6928" font-size="18" font-weight="700" text-anchor="middle">继续生产，但亏损</text><text x="442" y="230" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#806c42" font-size="13" font-weight="500" text-anchor="middle">收入覆盖可变成本</text><text x="670" y="165" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#147f80" font-size="17" font-weight="700" text-anchor="middle">P &gt; min ATC</text><text x="670" y="198" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#147f80" font-size="18" font-weight="700" text-anchor="middle">正经济利润</text><text x="670" y="230" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#4d7771" font-size="13" font-weight="500" text-anchor="middle">吸引长期进入</text><text x="440" y="375" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="15" font-weight="500" text-anchor="middle">价格 P 与单位成本比较（示意区间）</text><text x="110" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="14" font-weight="500" text-anchor="start">短期关停与长期退出不是同一决策</text></svg>