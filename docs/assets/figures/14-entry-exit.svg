<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c14a-title c14a-desc"><title id="c14a-title">需求冲击后的短期与长期调整</title><desc id="c14a-desc">原均衡为数量 40、价格 60。需求右移后，短期价格升到 80 并带来正经济利润；新企业进入使供给右移，价格回到长期水平 60，数量增至 80。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">超额利润如何被进入抹平（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="60" stroke="#24373b" stroke-width="2"/><line x1="110" y1="360" x2="810" y2="360" stroke="#e5ece9" stroke-width="1"/><text x="102" y="365" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><line x1="110" y1="310" x2="810" y2="310" stroke="#e5ece9" stroke-width="1"/><text x="102" y="315" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="260" x2="810" y2="260" stroke="#e5ece9" stroke-width="1"/><text x="102" y="265" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text><line x1="110" y1="210" x2="810" y2="210" stroke="#e5ece9" stroke-width="1"/><text x="102" y="215" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><line x1="110" y1="160" x2="810" y2="160" stroke="#e5ece9" stroke-width="1"/><text x="102" y="165" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">100</text><line x1="110" y1="110" x2="810" y2="110" stroke="#e5ece9" stroke-width="1"/><text x="102" y="115" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">120</text>
<line x1="110" y1="160" x2="810" y2="410" stroke="#24373b" stroke-width="2.6"/><text x="300" y="315" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#24373b" text-anchor="middle" font-weight="700">D₀: P=100−Q</text>
<line x1="110" y1="60" x2="810" y2="310" stroke="#2f855a" stroke-width="2.6"/><text x="700" y="150" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#2f855a" text-anchor="middle" font-weight="700">D₁: P=140−Q</text>
<line x1="110" y1="360" x2="810" y2="110" stroke="#147f80" stroke-width="2.6"/><text x="330" y="200" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="middle" font-weight="700">S₀: P=20+Q</text>
<line x1="250" y1="410" x2="810" y2="210" stroke="#d06d4d" stroke-width="2.6"/><text x="720" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="middle" font-weight="700">S₁: P=Q−20</text>
<line x1="110" y1="260" x2="810" y2="260" stroke="#7461ba" stroke-width="2.2" stroke-dasharray="9 6"/><text x="800" y="253" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="end" font-weight="700">长期价格 = 最低 ATC = 60</text>
<circle cx="390" cy="260" r="6.5" fill="#fffefa" stroke="#24373b" stroke-width="3"/><text x="382" y="282" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#24373b" text-anchor="end" font-weight="700">原均衡（40, 60）</text>
<circle cx="530" cy="210" r="6.5" fill="#fffefa" stroke="#b7791f" stroke-width="3"/><text x="540" y="200" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="start" font-weight="700">短期（60, 80）：正利润</text>
<circle cx="670" cy="260" r="6.5" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="662" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="end" font-weight="700">新长期均衡（80, 60）</text>
<text x="110" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="250" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text><text x="390" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">40</text><text x="530" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">60</text><text x="670" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">80</text><text x="810" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">100</text><text x="450" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">数量 Q（件）；价格 P（元/件）</text></svg>
