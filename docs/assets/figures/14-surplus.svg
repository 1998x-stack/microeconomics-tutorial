<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="c14b-title c14b-desc"><title id="c14b-title">竞争均衡处的消费者剩余与生产者剩余</title><desc id="c14b-desc">需求 D 为 P=100−Q，供给 S 为 P=20+Q，交于数量 40、价格 60。价格线之上的消费者剩余为 800，价格线之下的生产者剩余为 800，总剩余 1600。</desc><rect width="880" height="450" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">总剩余 = 消费者剩余 + 生产者剩余（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="60" stroke="#24373b" stroke-width="2"/><line x1="110" y1="356.2" x2="810" y2="356.2" stroke="#e5ece9" stroke-width="1"/><text x="102" y="361" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><line x1="110" y1="302.3" x2="810" y2="302.3" stroke="#e5ece9" stroke-width="1"/><text x="102" y="307" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="248.5" x2="810" y2="248.5" stroke="#e5ece9" stroke-width="1"/><text x="102" y="253" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text><line x1="110" y1="194.6" x2="810" y2="194.6" stroke="#e5ece9" stroke-width="1"/><text x="102" y="199" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><line x1="110" y1="140.8" x2="810" y2="140.8" stroke="#e5ece9" stroke-width="1"/><text x="102" y="145" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">100</text>
<polygon points="110,141 390,248.5 110,248.5" fill="#147f80" fill-opacity="0.16"/><polygon points="110,248.5 390,248.5 110,356.2" fill="#d06d4d" fill-opacity="0.18"/>
<line x1="110" y1="141" x2="810" y2="410" stroke="#147f80" stroke-width="3"/><text x="560" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="start" font-weight="700">D: P = 100 − Q</text>
<line x1="110" y1="356.2" x2="810" y2="87" stroke="#d06d4d" stroke-width="3"/><text x="560" y="186" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#d06d4d" text-anchor="start" font-weight="700">S: P = 20 + Q</text>
<line x1="110" y1="248.5" x2="810" y2="248.5" stroke="#7461ba" stroke-width="2.2" stroke-dasharray="9 6"/><text x="800" y="242" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="end" font-weight="700">P* = 60</text>
<circle cx="390" cy="248.5" r="6.5" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="400" y="272" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="start" font-weight="700">均衡（40, 60）</text>
<text x="205" y="212" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#0e6668" text-anchor="middle" font-weight="700">消费者剩余 800</text><text x="205" y="326" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#a8522f" text-anchor="middle" font-weight="700">生产者剩余 800</text>
<text x="110" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="250" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text><text x="390" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">40</text><text x="530" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">60</text><text x="670" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">80</text><text x="810" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">100</text></svg>
