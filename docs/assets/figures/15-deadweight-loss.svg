<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="c15b-title c15b-desc"><title id="c15b-title">垄断的无谓损失</title><desc id="c15b-desc">需求 P=100−Q 高于水平边际成本 MC=20。垄断产量 40 与竞争产量 80 之间，需求曲线高于 MC 的交易未发生，构成面积 800 的三角形无谓损失。</desc><rect width="880" height="450" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">无谓损失：本应发生的交易没有发生（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="342" x2="810" y2="342" stroke="#e5ece9" stroke-width="1"/><text x="102" y="347" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><line x1="110" y1="274" x2="810" y2="274" stroke="#e5ece9" stroke-width="1"/><text x="102" y="279" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="206" x2="810" y2="206" stroke="#e5ece9" stroke-width="1"/><text x="102" y="211" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text><line x1="110" y1="138" x2="810" y2="138" stroke="#e5ece9" stroke-width="1"/><text x="102" y="143" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">100</text>
<polygon points="390,206 670,342 390,342" fill="#c0392b" fill-opacity="0.18"/>
<line x1="110" y1="70" x2="810" y2="410" stroke="#147f80" stroke-width="3"/><text x="700" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="end" font-weight="700">需求 D: P=100−Q</text>
<line x1="110" y1="342" x2="810" y2="342" stroke="#d06d4d" stroke-width="3"/><text x="800" y="337" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="end" font-weight="700">MC = 20</text>
<line x1="390" y1="342" x2="390" y2="206" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="390" cy="342" r="6.5" fill="#fffefa" stroke="#b7791f" stroke-width="3"/><circle cx="670" cy="342" r="6.5" fill="#fffefa" stroke="#2f855a" stroke-width="3"/><circle cx="390" cy="206" r="6" fill="#fffefa" stroke="#7461ba" stroke-width="3"/>
<text x="384" y="368" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="end" font-weight="700">Qm=40，Pm=60</text><text x="680" y="368" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#2f855a" text-anchor="start" font-weight="700">Qc=80（P=MC）</text>
<text x="530" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">无谓损失 = (60−20)×(80−40)/2 = 800</text>
<text x="110" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="250" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text><text x="390" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">40</text><text x="530" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">60</text><text x="670" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">80</text><text x="810" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">100</text></svg>
