<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c15a-title c15a-desc"><title id="c15a-title">垄断者的定价与利润</title><desc id="c15a-desc">需求 P=100−Q 与边际收益 MR=100−2Q 从同一截距出发，MR 斜率是需求的两倍。MR 与边际成本 MC=20 交于数量 40，对应垄断价格 60，利润矩形面积为 1600。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">MR = MC 定产量，价格从需求曲线读出（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="342" x2="810" y2="342" stroke="#e5ece9" stroke-width="1"/><text x="102" y="347" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><line x1="110" y1="274" x2="810" y2="274" stroke="#e5ece9" stroke-width="1"/><text x="102" y="279" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="206" x2="810" y2="206" stroke="#e5ece9" stroke-width="1"/><text x="102" y="211" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text><line x1="110" y1="138" x2="810" y2="138" stroke="#e5ece9" stroke-width="1"/><text x="102" y="143" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">100</text>
<line x1="110" y1="70" x2="810" y2="410" stroke="#147f80" stroke-width="3"/><text x="590" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="start" font-weight="700">需求 D: P=100−Q</text>
<line x1="110" y1="70" x2="460" y2="410" stroke="#7461ba" stroke-width="3"/><text x="360" y="180" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="middle" font-weight="700">MR=100−2Q</text>
<line x1="110" y1="342" x2="810" y2="342" stroke="#d06d4d" stroke-width="3"/><text x="800" y="337" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="end" font-weight="700">MC = 20</text>
<rect x="110" y="206" width="280" height="136" fill="#c0392b" fill-opacity="0.14" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="390" y1="410" x2="390" y2="206" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="390" cy="342" r="6.5" fill="#fffefa" stroke="#b7791f" stroke-width="3"/><circle cx="390" cy="206" r="6.5" fill="#fffefa" stroke="#7461ba" stroke-width="3"/>
<text x="398" y="356" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="start" font-weight="700">Qm=40（MR=MC）</text><text x="398" y="198" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="start" font-weight="700">Pm=60</text>
<text x="200" y="278" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#c0392b" text-anchor="middle" font-weight="700">垄断利润 =(60−20)×40 = 1600</text>
<text x="110" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="250" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text><text x="390" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">40</text><text x="530" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">60</text><text x="670" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">80</text><text x="810" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">100</text><text x="450" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">数量 Q（件）；价格 P（元/件）</text></svg>
