<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="fig15b-title fig15b-desc"><title id="fig15b-title">两个市场分组定价时的需求与边际收入</title><desc id="fig15b-desc">A组需求P=80−QA，MR=80−2QA；B组需求P=60−0.5QB，MR=60−QB；共同边际成本20，最优价格分别为50和40。</desc><rect width="880" height="450" fill="#fffefa"/><text x="35" y="38" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#24373b" font-size="20" font-weight="700" text-anchor="start">第三度价格歧视：不同需求弹性对应不同最优价格</text><line x1="90" y1="355" x2="410" y2="355" stroke="#8c9a99" stroke-width="2" /><line x1="90" y1="355" x2="90" y2="85" stroke="#8c9a99" stroke-width="2" /><line x1="485" y1="355" x2="810" y2="355" stroke="#8c9a99" stroke-width="2" /><line x1="485" y1="355" x2="485" y2="85" stroke="#8c9a99" stroke-width="2" /><polyline points="90.0,107.0 386.0,355.0" fill="none" stroke="#147f80" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><polyline points="90.0,107.0 238.0,355.0" fill="none" stroke="#7461ba" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><line x1="90" y1="293" x2="386" y2="293" stroke="#d06d4d" stroke-width="2.8" /><circle cx="201" cy="200" r="6" fill="#fffefa" stroke="#147f80" stroke-width="3"/><text x="209" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#147f80" font-size="14" font-weight="700" text-anchor="start">A: q=30, p=50</text><polyline points="485.0,109.0 762.5,262.8" fill="none" stroke="#d06d4d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><polyline points="485.0,109.0 707.0,355.0" fill="none" stroke="#7461ba" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><line x1="485" y1="273" x2="762.5" y2="273" stroke="#147f80" stroke-width="2.8" /><circle cx="633" cy="191" r="6" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><text x="641" y="181" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#d06d4d" font-size="14" font-weight="700" text-anchor="start">B: q=40, p=40</text><text x="95" y="70" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#147f80" font-size="15" font-weight="500" text-anchor="start">A组：较缺乏弹性</text><text x="490" y="70" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#d06d4d" font-size="15" font-weight="500" text-anchor="start">B组：较富有弹性</text><text x="410" y="395" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="14" font-weight="500" text-anchor="end">数量 Q_A</text><text x="810" y="395" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="14" font-weight="500" text-anchor="end">数量 Q_B</text><text x="90" y="55" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="13" font-weight="500" text-anchor="start">价格</text><text x="485" y="55" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#5c7074" font-size="13" font-weight="500" text-anchor="start">价格</text></svg>