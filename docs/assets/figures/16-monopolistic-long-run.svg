<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c16b-title c16b-desc"><title id="c16b-title">垄断竞争的长期均衡与过剩产能</title><desc id="c16b-desc">教学示例：自由进入使需求左移到 P=40−3q，与平均总成本 ATC 在 q=4、P=28 处相切，经济利润为零。最小平均成本出现在 q=8，长期产量低于该有效规模，差额 4 件即过剩产能。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">长期：自由进入压低需求，直到 P=ATC、利润为零（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="297" x2="810" y2="297" stroke="#e5ece9" stroke-width="1"/><text x="102" y="302" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><line x1="110" y1="183" x2="810" y2="183" stroke="#e5ece9" stroke-width="1"/><text x="102" y="188" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text>
<polyline points="180,172 215,227 250,251 320,270 390,274 460,272 530,266 600,259" fill="none" stroke="#3d5a5c" stroke-width="3"/><text x="606" y="253" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#3d5a5c" text-anchor="start" font-weight="700">ATC</text>
<line x1="110" y1="183" x2="577" y2="410" stroke="#147f80" stroke-width="3"/><text x="470" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="start" font-weight="700">需求 D: P=40−3q</text>
<line x1="110" y1="183" x2="343" y2="410" stroke="#7461ba" stroke-width="3"/><text x="150" y="150" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="start" font-weight="700">MR=40−6q</text>
<line x1="110" y1="365" x2="810" y2="138" stroke="#d06d4d" stroke-width="3"/><text x="700" y="150" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="start" font-weight="700">MC=8+2q</text>
<line x1="250" y1="410" x2="250" y2="251.3" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="390" y1="274" x2="390" y2="410" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="255" y1="274" x2="385" y2="274" stroke="#b7791f" stroke-width="2"/><polygon points="390,274 380,269 380,279" fill="#b7791f"/><polygon points="250,274 260,269 260,279" fill="#b7791f"/><circle cx="250" cy="251.3" r="6.5" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><circle cx="390" cy="274" r="5.5" fill="#fffefa" stroke="#b7791f" stroke-width="3"/>
<text x="250" y="243" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="middle" font-weight="700">切点 q*=4，P=28=ATC</text><text x="398" y="400" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="start" font-weight="700">有效规模 q=8（ATC 最低 24）</text><text x="320" y="264" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#b7791f" text-anchor="middle" font-weight="700">过剩产能 = 8−4 = 4 件</text>
<text x="110" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="250" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">4</text><text x="390" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">8</text><text x="530" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">12</text><text x="670" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">16</text><text x="810" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text><text x="460" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">数量 q（件/期）；价格 P（元/件）</text></svg>
