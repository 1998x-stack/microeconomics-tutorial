<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c16a-title c16a-desc"><title id="c16a-title">垄断竞争企业的短期均衡与正经济利润</title><desc id="c16a-desc">教学示例：需求 P=56−3q 与边际收益 MR=56−6q 从同一截距出发。MR 与边际成本 MC=8+2q 交于产量 6，对应价格 38；此时平均总成本 ATC≈24.7，红色矩形为经济利润 80。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">短期：差异化带来定价权，企业赚取正经济利润（教学示例）</text>
