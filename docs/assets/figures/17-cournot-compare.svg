<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c17b-title c17b-desc"><title id="c17b-title">完全竞争、古诺与串谋三种市场结果</title><desc id="c17b-desc">教学示例：反需求 P=120−Q、边际成本为 0。完全竞争产量 120、价格 0；古诺双头产量 80、价格 40；串谋（垄断）产量 60、价格 60。三点都落在同一条需求曲线上，古诺居中，串谋最靠近垄断。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">同一需求曲线上的三种结局：竞争、古诺、串谋（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="296.7" x2="810" y2="296.7" stroke="#e5ece9" stroke-width="1"/><text x="102" y="301.7" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="183.3" x2="810" y2="183.3" stroke="#e5ece9" stroke-width="1"/><text x="102" y="188.3" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">120</text>
<line x1="110" y1="70" x2="810" y2="410" stroke="#147f80" stroke-width="3"/><text x="620" y="150" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="start" font-weight="700">需求 D: P=120−Q</text>
<circle cx="810" cy="410" r="7" fill="#fffefa" stroke="#2f855a" stroke-width="3.5"/><text x="800" y="398" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#2f855a" text-anchor="end" font-weight="700">完全竞争：Q=120，P=0</text>
<circle cx="576.7" cy="296.7" r="7" fill="#fffefa" stroke="#7461ba" stroke-width="3.5"/><text x="568" y="288" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="end" font-weight="700">古诺：Q=80，P=40</text>
<circle cx="460" cy="240" r="7" fill="#fffefa" stroke="#c0392b" stroke-width="3.5"/><text x="452" y="232" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">串谋（垄断）：Q=60，P=60</text>
