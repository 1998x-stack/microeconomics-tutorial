<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c17a-title c17a-desc"><title id="c17a-title">古诺双头垄断的反应函数与纳什均衡</title><desc id="c17a-desc">教学示例：反需求 P=120−Q、边际成本为 0。厂商 1 的反应函数 q1=(120−q2)/2 与厂商 2 的 q2=(120−q1)/2 相交于 (40,40)，即古诺纳什均衡，此时市场总产量 80、价格 40。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">两条反应函数的交点就是古诺纳什均衡（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="296.7" x2="810" y2="296.7" stroke="#e5ece9" stroke-width="1"/><text x="102" y="301.7" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="183.3" x2="810" y2="183.3" stroke="#e5ece9" stroke-width="1"/><text x="102" y="188.3" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">120</text>
<line x1="460" y1="410" x2="110" y2="70" stroke="#147f80" stroke-width="3"/><text x="205" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="start" font-weight="700">厂商1 反应函数 q1=(120−q2)/2</text>
<line x1="110" y1="240" x2="810" y2="410" stroke="#d06d4d" stroke-width="3"/><text x="600" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="start" font-weight="700">厂商2 反应函数 q2=(120−q1)/2</text>
<line x1="343.3" y1="296.7" x2="343.3" y2="410" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="110" y1="296.7" x2="343.3" y2="296.7" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="343.3" cy="296.7" r="7" fill="#fffefa" stroke="#7461ba" stroke-width="3.5"/>
<text x="354" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="start" font-weight="700">纳什均衡 (q1,q2)=(40,40)</text><text x="343.3" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">40</text>
<text x="110" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="576.7" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">80</text><text x="810" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">120</text><text x="460" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">厂商1 产量 q1（件/期）</text><text x="40" y="240" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle" transform="rotate(-90 40 240)">厂商2 产量 q2（件/期）</text></svg>
