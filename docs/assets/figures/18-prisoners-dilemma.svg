<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c18a-title c18a-desc"><title id="c18a-title">囚徒困境：双头定价博弈的收益矩阵</title><desc id="c18a-desc">教学示例收益矩阵：两家企业各自选择高价或低价。无论对手选什么，降价都能提高自己的收益（12 或 4 大于 10 或 2），因此“低价”是占优策略；均衡（低价，低价）得到 (4,4)，却劣于双方都选高价的 (10,10)。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">囚徒困境：各自的占优策略把双方都推向更差的结果（教学示例）</text>
<line x1="260" y1="150" x2="660" y2="150" stroke="#24373b" stroke-width="2"/><line x1="260" y1="280" x2="660" y2="280" stroke="#24373b" stroke-width="1.5"/><line x1="260" y1="410" x2="660" y2="410" stroke="#24373b" stroke-width="2"/><line x1="260" y1="150" x2="260" y2="410" stroke="#24373b" stroke-width="2"/><line x1="460" y1="150" x2="460" y2="410" stroke="#24373b" stroke-width="1.5"/><line x1="660" y1="150" x2="660" y2="410" stroke="#24373b" stroke-width="2"/>
<text x="360" y="138" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="middle" font-weight="700">对手：高价 H</text><text x="560" y="138" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="middle" font-weight="700">对手：低价 L</text><text x="548" y="96" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#617479" text-anchor="middle">（每格为 “我，对手”）</text>
<text x="250" y="222" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="end" font-weight="700">我：高价 H</text><text x="250" y="352" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="end" font-weight="700">我：低价 L</text>
<rect x="264" y="154" width="192" height="122" fill="#147f80" fill-opacity="0.08" stroke="#147f80" stroke-width="2" stroke-dasharray="6 4"/><rect x="464" y="284" width="192" height="122" fill="#7461ba" fill-opacity="0.14" stroke="#7461ba" stroke-width="2.5"/>
<text x="360" y="222" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="middle" font-weight="700">( 10 , 10 )</text><text x="560" y="222" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="middle" font-weight="700">( 2 , 12 )</text><text x="360" y="352" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="middle" font-weight="700">( 12 , 2 )</text><text x="560" y="352" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="middle" font-weight="700">( 4 , 4 )</text>
<text x="290" y="192" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#147f80" text-anchor="start" font-weight="700">帕累托最优</text><text x="490" y="322" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#7461ba" text-anchor="start" font-weight="700">纳什均衡</text>
<text x="260" y="440" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#5c7074" text-anchor="start">降价是占优策略：12&gt;10 且 4&gt;2，于是 (低价,低价) 成为唯一纳什均衡；但它比 (高价,高价) 更差。</text></svg>
