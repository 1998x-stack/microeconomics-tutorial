<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c18b-title c18b-desc"><title id="c18b-title">重复博弈中的合作与背叛路径</title><desc id="c18b-desc">教学示例：每期坚持合作各得 10；先背叛一期得 12，但此后对手触发惩罚，每期只余 4。只要贴现因子 δ 不小于临界值 (12−10)/(12−4)=0.25，长期合作的现值就不低于背叛，触发策略可以维持合作。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">重复博弈：只要足够看重未来，合作就能自我维持（教学示例）</text>
<text x="60" y="160" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" text-anchor="start" font-weight="700">合作路径</text><text x="60" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#d06d4d" text-anchor="start" font-weight="700">背叛路径</text>
<rect x="200" y="130" width="110" height="56" rx="7" fill="#147f80" fill-opacity="0.10" stroke="#147f80" stroke-width="2"/><text x="255" y="165" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#147f80" text-anchor="middle" font-weight="700">10</text><rect x="340" y="130" width="110" height="56" rx="7" fill="#147f80" fill-opacity="0.10" stroke="#147f80" stroke-width="2"/><text x="395" y="165" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#147f80" text-anchor="middle" font-weight="700">10</text><rect x="480" y="130" width="110" height="56" rx="7" fill="#147f80" fill-opacity="0.10" stroke="#147f80" stroke-width="2"/><text x="535" y="165" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#147f80" text-anchor="middle" font-weight="700">10</text><text x="700" y="165" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#147f80" text-anchor="middle" font-weight="700">…</text>
<line x1="314" y1="158" x2="334" y2="158" stroke="#147f80" stroke-width="2"/><polygon points="340,158 330,153 330,163" fill="#147f80"/><line x1="454" y1="158" x2="474" y2="158" stroke="#147f80" stroke-width="2"/><polygon points="480,158 470,153 470,163" fill="#147f80"/><line x1="594" y1="158" x2="614" y2="158" stroke="#147f80" stroke-width="2"/><polygon points="620,158 610,153 610,163" fill="#147f80"/>
<rect x="200" y="260" width="110" height="56" rx="7" fill="#d06d4d" fill-opacity="0.12" stroke="#d06d4d" stroke-width="2"/><text x="255" y="295" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#d06d4d" text-anchor="middle" font-weight="700">12</text><rect x="340" y="260" width="110" height="56" rx="7" fill="#d06d4d" fill-opacity="0.12" stroke="#d06d4d" stroke-width="2"/><text x="395" y="295" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#d06d4d" text-anchor="middle" font-weight="700">4</text><rect x="480" y="260" width="110" height="56" rx="7" fill="#d06d4d" fill-opacity="0.12" stroke="#d06d4d" stroke-width="2"/><text x="535" y="295" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#d06d4d" text-anchor="middle" font-weight="700">4</text><text x="700" y="295" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#d06d4d" text-anchor="middle" font-weight="700">…</text>
<line x1="314" y1="288" x2="334" y2="288" stroke="#d06d4d" stroke-width="2"/><polygon points="340,288 330,283 330,293" fill="#d06d4d"/><line x1="454" y1="288" x2="474" y2="288" stroke="#d06d4d" stroke-width="2"/><polygon points="480,288 470,283 470,293" fill="#d06d4d"/><line x1="594" y1="288" x2="614" y2="288" stroke="#d06d4d" stroke-width="2"/><polygon points="620,288 610,283 610,293" fill="#d06d4d"/>
<line x1="255" y1="186" x2="255" y2="256" stroke="#9aa9a6" stroke-width="1.8" stroke-dasharray="6 5"/><polygon points="255,256 250,246 260,246" fill="#9aa9a6"/><text x="266" y="226" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#617479" text-anchor="start" font-weight="700">背叛一次：得 12</text>
<text x="36" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#24373b" text-anchor="start">触发策略的维持条件：δ ≥ (12−10)/(12−4) = 0.25。</text><text x="36" y="404" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#5c7074" text-anchor="start">δ 越大表示越看重未来；δ 足够高时，长期合作的现值不低于“先赚一笔再被惩罚”。</text><text x="36" y="430" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#5c7074" text-anchor="start">重复、耐心与可观察的行为，是把一次性的囚徒困境变成可持续合作的关键。</text></svg>
