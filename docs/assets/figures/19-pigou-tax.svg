<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-labelledby="c19b-title c19b-desc"><title id="c19b-title">庇古税把外部成本内部化</title><desc id="c19b-desc">教学示例：对每单位征收 t=20 的庇古税，使私人边际成本上移到社会边际成本 MSC=40+Q。买方支付 70、卖方净得 50，产量回到社会最优 30，税收收入 20×30=600，无谓损失被消除。</desc><rect width="880" height="480" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">庇古税：让价格反映全部社会成本（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="342" x2="810" y2="342" stroke="#e5ece9" stroke-width="1"/><text x="102" y="347" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><line x1="110" y1="274" x2="810" y2="274" stroke="#e5ece9" stroke-width="1"/><text x="102" y="279" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="206" x2="810" y2="206" stroke="#e5ece9" stroke-width="1"/><text x="102" y="211" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text><line x1="110" y1="138" x2="810" y2="138" stroke="#e5ece9" stroke-width="1"/><text x="102" y="143" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">100</text>
<rect x="110" y="172" width="350" height="68" fill="#b7791f" fill-opacity="0.13" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="110" y1="70" x2="810" y2="274" stroke="#147f80" stroke-width="3"/><text x="742" y="240" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="end" font-weight="700">需求 D: P=100−Q</text>
<line x1="110" y1="342" x2="810" y2="138" stroke="#d06d4d" stroke-width="3"/><text x="150" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#d06d4d" text-anchor="start" font-weight="700">私人边际成本 MPC=20+Q</text>
<line x1="110" y1="274" x2="810" y2="70" stroke="#7461ba" stroke-width="3"/><text x="150" y="250" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="start" font-weight="700">社会边际成本 MSC=MPC+t</text>
<line x1="460" y1="410" x2="460" y2="172" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="110" y1="172" x2="460" y2="172" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="460" y1="172" x2="460" y2="240" stroke="#c0392b" stroke-width="2.4"/><polygon points="460,172 455,181 465,181" fill="#c0392b"/><polygon points="460,240 455,231 465,231" fill="#c0392b"/><circle cx="460" cy="172" r="6.5" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><circle cx="460" cy="240" r="6" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/>
<text x="450" y="166" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="end" font-weight="700">买方价 P=70</text><text x="470" y="246" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="start" font-weight="700">卖方净得 50</text><text x="300" y="210" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#b7791f" text-anchor="middle" font-weight="700">税收收入 = 20×30 = 600</text><text x="470" y="150" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">税楔 t=20</text>
<text x="110" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="343" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text><text x="577" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">40</text><text x="810" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">60</text><text x="460" y="470" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">数量 Q（件/期）；价格 P（元/件）</text></svg>
