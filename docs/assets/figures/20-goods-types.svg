<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c20b-title c20b-desc"><title id="c20b-title">按排他性与竞争性划分的四类物品</title><desc id="c20b-desc">用两个维度划分物品：是否排他（能否阻止他人使用）与是否竞争（一人使用是否减少他人可用量）。由此得到私人物品、俱乐部物品、公共资源和公共物品四类，各自的供给与治理问题不同。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">两个维度，四类物品：供给难题各不相同（教学示意）</text>
<line x1="250" y1="170" x2="670" y2="170" stroke="#24373b" stroke-width="2"/><line x1="250" y1="280" x2="670" y2="280" stroke="#24373b" stroke-width="1.5"/><line x1="250" y1="390" x2="670" y2="390" stroke="#24373b" stroke-width="2"/><line x1="250" y1="170" x2="250" y2="390" stroke="#24373b" stroke-width="2"/><line x1="460" y1="170" x2="460" y2="390" stroke="#24373b" stroke-width="1.5"/><line x1="670" y1="170" x2="670" y2="390" stroke="#24373b" stroke-width="2"/>
<text x="355" y="158" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#24373b" text-anchor="middle" font-weight="700">竞争性 rival</text><text x="565" y="158" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#24373b" text-anchor="middle" font-weight="700">非竞争性 non-rival</text>
<text x="240" y="230" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#24373b" text-anchor="end" font-weight="700">排他性</text><text x="240" y="340" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#24373b" text-anchor="end" font-weight="700">非排他性</text>
<rect x="254" y="174" width="202" height="102" fill="#147f80" fill-opacity="0.08"/><rect x="464" y="174" width="202" height="102" fill="#7461ba" fill-opacity="0.08"/><rect x="254" y="284" width="202" height="102" fill="#d06d4d" fill-opacity="0.12" stroke="#d06d4d" stroke-width="2"/><rect x="464" y="284" width="202" height="102" fill="#7461ba" fill-opacity="0.16" stroke="#7461ba" stroke-width="2.5"/>
<text x="355" y="220" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#24373b" text-anchor="middle" font-weight="700">私人物品</text><text x="355" y="244" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">面包、衣服</text>
<text x="565" y="220" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#24373b" text-anchor="middle" font-weight="700">俱乐部物品</text><text x="565" y="244" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">有线电视、收费公路</text>
<text x="355" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#d06d4d" text-anchor="middle" font-weight="700">公共资源</text><text x="355" y="354" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">渔场、地下水（公地悲剧）</text>
<text x="565" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" text-anchor="middle" font-weight="700">公共物品</text><text x="565" y="354" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">国防、路灯（自由搭车）</text>
<text x="36" y="424" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="start">排他性：能否阻止他人使用；竞争性：一人使用是否减少他人可用量。</text><text x="36" y="448" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="start">很多现实物品落在这两个维度的中间地带，而非严格归入某一格。</text></svg>
