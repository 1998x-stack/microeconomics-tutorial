<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c20a-title c20a-desc"><title id="c20a-title">公共物品的垂直加总与供给不足</title><desc id="c20a-desc">教学示例：两个人对公共物品的边际支付意愿分别为 12−x 与 8−x。公共物品不可分割消费，社会边际收益是两人之和 20−2x。与边际成本 8 相等得有效数量 6；但私人各自决策只会供到 4，出现供给不足。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">公共物品：收益要竖着加，私人供给偏向不足（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="274" x2="810" y2="274" stroke="#e5ece9" stroke-width="1"/><text x="102" y="279" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">8</text><line x1="110" y1="206" x2="810" y2="206" stroke="#e5ece9" stroke-width="1"/><text x="102" y="211" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">12</text><line x1="110" y1="138" x2="810" y2="138" stroke="#e5ece9" stroke-width="1"/><text x="102" y="143" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">16</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text>
<line x1="110" y1="206" x2="810" y2="410" stroke="#147f80" stroke-width="3"/><text x="700" y="392" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="end" font-weight="700">个人1 边际支付意愿 12−x</text>
<line x1="110" y1="274" x2="577" y2="410" stroke="#3d5a5c" stroke-width="3"/><text x="180" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#3d5a5c" text-anchor="start" font-weight="700">个人2 边际支付意愿 8−x</text>
<line x1="110" y1="70" x2="693" y2="410" stroke="#7461ba" stroke-width="3"/><text x="150" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="start" font-weight="700">社会边际收益 =20−2x（垂直相加）</text>
<line x1="110" y1="274" x2="810" y2="274" stroke="#d06d4d" stroke-width="3"/><text x="800" y="268" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="end" font-weight="700">MC = 8</text>
<line x1="460" y1="410" x2="460" y2="274" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="343" y1="410" x2="343" y2="274" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="460" cy="274" r="6.5" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><circle cx="343" cy="274" r="6.5" fill="#fffefa" stroke="#b7791f" stroke-width="3"/>
<text x="470" y="266" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="start" font-weight="700">有效数量 x*=6（社会收益=MC）</text><text x="333" y="296" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="end" font-weight="700">私人供给仅到 x=4（自由搭车）</text>
<text x="110" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="343" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">4</text><text x="577" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">8</text><text x="810" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">12</text><text x="460" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">公共物品数量 x（单位/期）；边际收益与成本（元/单位）</text></svg>
