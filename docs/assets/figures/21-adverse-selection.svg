<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c21a-title c21a-desc"><title id="c21a-title">逆向选择：信息不对称赶走高质量卖家</title><desc id="c21a-desc">教学示意：二手车市场有两类车。信息对称时两类车分别成交；信息不对称时买方只能按期望价值出价，好车卖方因出价低于其保留价而退出，市场逐渐只剩差车，即逆向选择。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">逆向选择：买方看不清质量，好车先退出（教学示意）</text>
<rect x="50" y="60" width="370" height="360" rx="10" fill="#147f80" fill-opacity="0.06" stroke="#147f80" stroke-width="1.5"/><text x="235" y="88" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#147f80" text-anchor="middle" font-weight="700">信息对称（质量可观察）</text>
<rect x="80" y="110" width="310" height="86" rx="8" fill="#fffefa" stroke="#3d5a5c" stroke-width="1.5"/><text x="96" y="138" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="start" font-weight="700">好车（plum）</text><text x="96" y="162" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="start">卖方保留价 200，买方价值 240</text><text x="96" y="184" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#2f855a" text-anchor="start">价格落在 200–240 之间，成交</text>
<rect x="80" y="216" width="310" height="86" rx="8" fill="#fffefa" stroke="#3d5a5c" stroke-width="1.5"/><text x="96" y="244" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="start" font-weight="700">差车（lemon）</text><text x="96" y="268" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="start">卖方保留价 60，买方价值 100</text><text x="96" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#2f855a" text-anchor="start">价格落在 60–100 之间，成交</text>
<text x="235" y="392" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="middle" font-weight="700">两类车都进入市场，效率最高</text>
<rect x="460" y="60" width="370" height="360" rx="10" fill="#d06d4d" fill-opacity="0.07" stroke="#d06d4d" stroke-width="1.5"/><text x="645" y="88" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#d06d4d" text-anchor="middle" font-weight="700">信息不对称（质量不可观察）</text>
<rect x="490" y="110" width="310" height="70" rx="8" fill="#fffefa" stroke="#b7791f" stroke-width="1.5"/><text x="506" y="138" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="start" font-weight="700">买方只按期望价值出价</text><text x="506" y="164" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="start">如各半时 =0.5×240+0.5×100=170</text>
<line x1="645" y1="184" x2="645" y2="212" stroke="#9aa9a6" stroke-width="2"/><polygon points="645,216 640,206 650,206" fill="#9aa9a6"/>
<rect x="490" y="220" width="310" height="70" rx="8" fill="#fffefa" stroke="#c0392b" stroke-width="1.5"/><text x="506" y="248" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">好车卖方退出（170 &lt; 200）</text><text x="506" y="274" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="start">只剩差车被卖出</text>
<line x1="645" y1="294" x2="645" y2="322" stroke="#9aa9a6" stroke-width="2"/><polygon points="645,326 640,316 650,316" fill="#9aa9a6"/>
<rect x="490" y="330" width="310" height="60" rx="8" fill="#fffefa" stroke="#3d5a5c" stroke-width="1.5"/><text x="506" y="356" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#24373b" text-anchor="start" font-weight="700">买方察觉质量偏低，再度压价</text><text x="506" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="start">市场“逆向”萎缩，高质量车难以成交</text></svg>
