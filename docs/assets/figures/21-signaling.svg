<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c21b-title c21b-desc"><title id="c21b-title">信号发送：教育作为能力的分离信号</title><desc id="c21b-desc">教学示例：高能力者受教育的成本更低（2e），低能力者更高（4e）。若教育带来 40 的工资收益，门槛 e* 落在 10 到 20 之间时，低能力者不愿模仿、高能力者愿意投入，教育就能分离出两种类型。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">信号发送：当成本因人而异，教育才能“证明”能力（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="325" x2="810" y2="325" stroke="#e5ece9" stroke-width="1"/><text x="102" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><line x1="110" y1="240" x2="810" y2="240" stroke="#e5ece9" stroke-width="1"/><text x="102" y="245" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="155" x2="810" y2="155" stroke="#e5ece9" stroke-width="1"/><text x="102" y="160" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">60</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text>
<rect x="460" y="150" width="350" height="90" fill="#7461ba" fill-opacity="0.10"/>
<line x1="110" y1="410" x2="810" y2="70" stroke="#d06d4d" stroke-width="3"/><text x="150" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="start" font-weight="700">低能力者成本 4e</text>
<line x1="110" y1="410" x2="810" y2="240" stroke="#147f80" stroke-width="3"/><text x="600" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="start" font-weight="700">高能力者成本 2e</text>
<line x1="110" y1="240" x2="810" y2="240" stroke="#7461ba" stroke-width="2.4" stroke-dasharray="7 5"/><text x="118" y="232" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="start" font-weight="700">信号收益 = 40（工资差）</text>
<line x1="460" y1="240" x2="460" y2="410" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="810" y1="240" x2="810" y2="410" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="635" y1="240" x2="635" y2="410" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/><circle cx="460" cy="240" r="6" fill="#fffefa" stroke="#d06d4d" stroke-width="3"/><circle cx="810" cy="240" r="6" fill="#fffefa" stroke="#147f80" stroke-width="3"/><circle cx="635" cy="240" r="6.5" fill="#fffefa" stroke="#c0392b" stroke-width="3"/>
<text x="460" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">10</text><text x="635" y="452" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">e*=15</text><text x="110" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="285" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">5</text><text x="810" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text>
<text x="635" y="128" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#7461ba" text-anchor="middle" font-weight="700">分离信号区间 e*∈(10,20)</text><text x="460" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">受教育年限 e（年）；成本与收益（元）</text></svg>
