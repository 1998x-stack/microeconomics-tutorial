<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c22a-title c22a-desc"><title id="c22a-title">洛伦兹曲线与基尼系数</title><desc id="c22a-desc">教学示例：五个人收入为 1、2、3、4、10，合计 20。洛伦兹曲线记录累计人口占比对应的累计收入占比，位于完全平等线之下。曲线与平等线之间面积 A 相对三角形 A+B 的比例即基尼系数，本例为 0.40。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">洛伦兹曲线越弯，收入分配越不均（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="240" x2="810" y2="240" stroke="#e5ece9" stroke-width="1"/><line x1="460" y1="70" x2="460" y2="410" stroke="#e5ece9" stroke-width="1"/>
<polygon points="110,410 250,393 390,359 530,308 670,240 810,70" fill="#7461ba" fill-opacity="0.16"/>
<line x1="110" y1="410" x2="810" y2="70" stroke="#147f80" stroke-width="3"/><text x="620" y="200" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="start" font-weight="700">完全平等线（45°）</text>
<polyline points="110,410 250,393 390,359 530,308 670,240 810,70" fill="none" stroke="#3d5a5c" stroke-width="3"/><text x="250" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#3d5a5c" text-anchor="start" font-weight="700">洛伦兹曲线</text>
<text x="500" y="330" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#7461ba" text-anchor="middle" font-weight="700">A</text><text x="330" y="395" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#5c7074" text-anchor="middle" font-weight="700">B</text>
<text x="36" y="60" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="start" font-weight="700">基尼系数 = A /(A+B) = 0.40</text>
<text x="110" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="250" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0.2</text><text x="390" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0.4</text><text x="530" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0.6</text><text x="670" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0.8</text><text x="810" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">1.0</text>
<text x="102" y="405" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">0</text><text x="102" y="245" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">0.5</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">1.0</text>
<text x="460" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">累计人口占比；纵轴为累计收入占比</text></svg>
