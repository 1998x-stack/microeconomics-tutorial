<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c22b-title c22b-desc"><title id="c22b-title">税收收入与超额负担随税率的变化</title><desc id="c22b-desc">教学示例：在需求 P=100−Q、供给 P=20+Q 下，税率 t 时成交 Q=40−t/2，税收收入=40t−t²/2，在 t=40 达到最高 800；超额负担=t²/4 随税率加速上升，在 t=40 时为 400。提高税率并非总能增加收入，却持续放大效率损失。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">税率与效率：收入有峰值，超额负担持续上升（教学示例）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="240" x2="810" y2="240" stroke="#e5ece9" stroke-width="1"/><line x1="460" y1="70" x2="460" y2="410" stroke="#e5ece9" stroke-width="1"/>
<polyline points="110,410 197.5,261.3 285,155 372.5,91.3 460,70 547.5,91.3 635,155 722.5,261.3 810,410" fill="none" stroke="#147f80" stroke-width="3"/><text x="700" y="110" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="end" font-weight="700">税收收入 = 40t − t²/2</text>
<polyline points="110,410 197.5,399.4 285,367.5 372.5,314.4 460,240 547.5,144.4 605.4,70" fill="none" stroke="#c0392b" stroke-width="3"/><text x="620" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#c0392b" text-anchor="start" font-weight="700">超额负担 = t²/4</text>
<line x1="460" y1="70" x2="460" y2="240" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="460" cy="70" r="6.5" fill="#fffefa" stroke="#b7791f" stroke-width="3"/><circle cx="460" cy="240" r="6.5" fill="#fffefa" stroke="#c0392b" stroke-width="3"/>
<text x="470" y="62" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#b7791f" text-anchor="start" font-weight="700">收入峰值：t=40，收入=800</text><text x="470" y="256" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">此时超额负担=400</text>
<text x="110" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="285" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">20</text><text x="460" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">40</text><text x="635" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">60</text><text x="810" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">80</text>
<text x="102" y="245" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">400</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">800</text>
<text x="460" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">单位税率 t（元/件）；税收收入与超额负担（元/期）</text></svg>
