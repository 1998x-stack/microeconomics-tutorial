<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c23b-title c23b-desc"><title id="c23b-title">补偿性差异：风险更高的工作支付更高工资</title><desc id="c23b-desc">教学示意：在竞争性劳动市场中，工作条件更差或风险更高时，需要更高工资才能吸引劳动者，形成向上倾斜的工资—风险关系，即补偿性差异。安全岗位工资较低，高风险岗位工资较高。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">补偿性差异：不愉快与风险要用工资来补偿（教学示意）</text>
<line x1="110" y1="410" x2="810" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="410" x2="110" y2="70" stroke="#24373b" stroke-width="2"/><line x1="110" y1="296.7" x2="810" y2="296.7" stroke="#e5ece9" stroke-width="1"/><text x="102" y="301.7" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">40</text><line x1="110" y1="183.3" x2="810" y2="183.3" stroke="#e5ece9" stroke-width="1"/><text x="102" y="188.3" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">80</text><text x="102" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">120</text>
<line x1="110" y1="268.3" x2="810" y2="126.7" stroke="#7461ba" stroke-width="3"/><text x="600" y="170" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="start" font-weight="700">工资—风险关系</text>
<circle cx="180" cy="254.2" r="7" fill="#fffefa" stroke="#2f855a" stroke-width="3.5"/><text x="190" y="248" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#2f855a" text-anchor="start" font-weight="700">安全岗位：w=55</text>
<circle cx="670" cy="155" r="7" fill="#fffefa" stroke="#c0392b" stroke-width="3.5"/><text x="660" y="148" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">高风险岗位：w=90</text>
<text x="460" y="380" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">同样的劳动者，愿意接受高风险岗位，前提是工资更高；</text><text x="460" y="402" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">这一差额就是补偿性差异。数值为教学示意，不代表特定行业数据。</text>
<text x="110" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">0</text><text x="250" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">2</text><text x="390" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">4</text><text x="530" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">6</text><text x="670" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">8</text><text x="810" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">10</text><text x="460" y="460" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">工作风险 / 不愉快程度（指数）；工资 w（元/期）</text></svg>
