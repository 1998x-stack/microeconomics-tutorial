<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c23a-title c23a-desc"><title id="c23a-title">竞争性劳动市场的均衡</title><desc id="c23a-desc">教学示例：劳动需求由边际产品价值决定，w=100−10L；劳动供给 w=40+10L。两者相交于就业 L=3、工资 w=70，此时边际产品价值等于工资。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" text-anchor="start" font-weight="700">工资由劳动的边际产品价值与供给共同决定（教学示例）</text>
