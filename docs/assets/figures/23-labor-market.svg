<line x1="110" y1="126.7" x2="810" y2="410" stroke="#147f80" stroke-width="3"/><text x="600" y="200" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="start" font-weight="700">劳动需求 VMPL=100−10L</text>
<line x1="110" y1="296.7" x2="670" y2="70" stroke="#d06d4d" stroke-width="3"/><text x="150" y="270" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#d06d4d" text-anchor="start" font-weight="700">劳动供给 w=40+10L</text>
<line x1="320" y1="410" x2="320" y2="211.7" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="110" y1="211.7" x2="320" y2="211.7" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="320" cy="211.7" r="7" fill="#fffefa" stroke="#7461ba" stroke-width="3.5"/>
