<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c24b-title c24b-desc"><title id="c24b-title">框架效应示意</title><desc id="c24b-desc">教学示意：同一组事实“100 名病人中 90 人存活”，用“90% 存活”的收益框架表述时，教学示意中接受治疗的比例较高；用“10% 死亡”的损失框架表述时较低。柱高不代表任何实验的精确数值。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">框架效应：同一事实，两种表述（教学示意）</text>
<rect x="290" y="52" width="300" height="62" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.6"/><text x="440" y="80" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="middle" font-weight="700">同一事实</text><text x="440" y="101" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">100 名病人中 90 人术后存活</text>
<line x1="380" y1="114" x2="240" y2="168" stroke="#9aa9a6" stroke-width="2"/><polygon points="240,168 252,161 246,173" fill="#9aa9a6"/><line x1="500" y1="114" x2="640" y2="168" stroke="#9aa9a6" stroke-width="2"/><polygon points="640,168 628,161 634,173" fill="#9aa9a6"/>
<rect x="60" y="176" width="360" height="244" rx="10" fill="#f3f8f6" stroke="#147f80" stroke-width="1.6"/><text x="240" y="205" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#147f80" text-anchor="middle" font-weight="700">收益框架：成功率 90%</text><line x1="110" y1="388" x2="370" y2="388" stroke="#24373b" stroke-width="2"/><rect x="190" y="250" width="100" height="138" fill="#147f80" opacity="0.85"/><text x="240" y="240" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="middle">接受比例较高</text><text x="240" y="410" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">柱高为教学示意，非实验实测值</text>
<rect x="460" y="176" width="360" height="244" rx="10" fill="#fdf1e9" stroke="#d06d4d" stroke-width="1.6"/><text x="640" y="205" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#d06d4d" text-anchor="middle" font-weight="700">损失框架：死亡率 10%</text><line x1="510" y1="388" x2="770" y2="388" stroke="#24373b" stroke-width="2"/><rect x="590" y="310" width="100" height="78" fill="#d06d4d" opacity="0.85"/><text x="640" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="middle">接受比例较低</text><text x="640" y="410" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">柱高为教学示意，非实验实测值</text>
<text x="240" y="452" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">表述方式（框架）改变选择</text><text x="640" y="452" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">信息内容完全相同</text></svg>
