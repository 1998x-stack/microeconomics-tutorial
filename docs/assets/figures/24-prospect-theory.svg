<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c24a-title c24a-desc"><title id="c24a-title">前景理论的价值函数</title><desc id="c24a-desc">教学示例：以参照点为原点，收益区曲线凹（青），损失区曲线凸且更陡（橘），参数 alpha=0.88、lambda=2.25。同样幅度 200 元的损失比收益带来更大的主观价值变化。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">价值函数：收益凹、损失凸且更陡（教学示例）</text>
<line x1="110" y1="250" x2="830" y2="250" stroke="#24373b" stroke-width="2"/><line x1="110" y1="72" x2="110" y2="415" stroke="#24373b" stroke-width="2"/><line x1="460" y1="72" x2="460" y2="415" stroke="#7461ba" stroke-width="1.8" stroke-dasharray="6 5"/>
<polyline fill="none" stroke="#147f80" stroke-width="3.5" points="460,250 530,234.1 600,220.7 670,208.1 740,196 810,180.9"/>
<polyline fill="none" stroke="#d06d4d" stroke-width="3.5" points="460,250 390,285.8 320,315.9 250,344.2 180,371.4 110,405.4"/>
<circle cx="460" cy="250" r="6" fill="#fffefa" stroke="#7461ba" stroke-width="3"/><text x="470" y="240" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" font-weight="700">参照点</text>
<text x="700" y="160" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#147f80" font-weight="700">收益区（凹）</text><text x="150" y="395" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#d06d4d" font-weight="700">损失区（凸、更陡）</text>
<text x="102" y="255" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">0</text><text x="102" y="188" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">+100</text><text x="102" y="412" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">−250</text>
<text x="810" y="430" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">+200 元</text><text x="110" y="430" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">−200 元</text>
<text x="240" y="458" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">结果 x（元，相对参照点）</text><text x="104" y="64" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="end">主观价值 v(x)</text></svg>
