<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c25b-title c25b-desc"><title id="c25b-title">逆向选择的死亡螺旋</title><desc id="c25b-desc">概念流程：保险公司按平均风险定价，高风险者更愿投保使投保池风险上升，赔付与保费随之上涨，低风险者退出，池中平均风险进一步上升，形成循环，可能导致市场萎缩。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">逆向选择如何形成“死亡螺旋”</text>
<rect x="60" y="66" width="330" height="86" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.6"/><text x="225" y="100" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="middle">保险公司按平均风险定价</text><text x="225" y="126" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">低风险者觉得“不划算”</text>
<rect x="490" y="66" width="330" height="86" rx="10" fill="#fdf1e9" stroke="#d06d4d" stroke-width="1.6"/><text x="655" y="100" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="middle">投保池中高风险者占比上升</text><text x="655" y="126" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">赔付预期抬高</text>
<rect x="490" y="238" width="330" height="86" rx="10" fill="#fdf1e9" stroke="#d06d4d" stroke-width="1.6"/><text x="655" y="272" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="middle">保费被迫上涨</text><text x="655" y="298" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">健康者更不愿意投保</text>
<rect x="60" y="238" width="330" height="86" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.6"/><text x="225" y="272" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#24373b" text-anchor="middle">更多低风险者退出</text><text x="225" y="298" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">平均风险再上升</text>
<line x1="390" y1="109" x2="490" y2="109" stroke="#9aa9a6" stroke-width="2"/><polygon points="490,109 478,103 478,115" fill="#9aa9a6"/><line x1="655" y1="152" x2="655" y2="238" stroke="#9aa9a6" stroke-width="2"/><polygon points="655,238 649,226 661,226" fill="#9aa9a6"/><line x1="490" y1="281" x2="390" y2="281" stroke="#9aa9a6" stroke-width="2"/><polygon points="390,281 402,275 402,287" fill="#9aa9a6"/><line x1="225" y1="238" x2="225" y2="152" stroke="#9aa9a6" stroke-width="2"/><polygon points="225,152 219,164 231,164" fill="#9aa9a6"/>
<line x1="440" y1="324" x2="440" y2="366" stroke="#9aa9a6" stroke-width="2"/><polygon points="440,366 434,354 446,354" fill="#9aa9a6"/>
<rect x="260" y="368" width="360" height="70" rx="10" fill="#f0edf8" stroke="#7461ba" stroke-width="1.8"/><text x="440" y="398" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#7461ba" text-anchor="middle" font-weight="700">死亡螺旋：市场可能萎缩甚至消失</text><text x="440" y="421" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">概念示意，非具体公司案例或实测数据</text></svg>
