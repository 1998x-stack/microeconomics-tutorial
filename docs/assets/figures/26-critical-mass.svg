<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c26b-title c26b-desc"><title id="c26b-title">网络效应的临界规模</title><desc id="c26b-desc">概念图：平台价值随用户规模呈 S 型曲线。早期增长缓慢，越过约 30% 的临界规模后自我强化、快速增长，最后趋于饱和。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">临界规模：越过引爆点后自我强化（概念示意）</text>
<line x1="110" y1="410" x2="820" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="70" x2="110" y2="410" stroke="#24373b" stroke-width="2"/>
<polyline fill="none" stroke="#147f80" stroke-width="3.5" points="110,410 179,382.8 248,342 317,257 386,172 455,121 524,93.8 593,80.2 662,73.4 731,70 800,70"/>
<line x1="317" y1="257" x2="317" y2="410" stroke="#7461ba" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="317" cy="257" r="7" fill="#fffefa" stroke="#7461ba" stroke-width="3.5"/>
<text x="327" y="248" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="start" font-weight="700">临界规模 ≈ 30%</text>
<text x="200" y="360" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">增长缓慢</text><text x="500" y="150" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="middle" font-weight="700">越过引爆点：快速自我强化</text><text x="720" y="105" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">趋于饱和</text>
<text x="465" y="440" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">用户规模（相对潜在市场，%）</text><text x="104" y="64" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="end">平台价值</text>
