<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c26a-title c26a-desc"><title id="c26a-title">双边市场的交叉网络效应</title><desc id="c26a-desc">概念图：买家一侧与卖家一侧相互增强。买家越多，卖家越愿意入驻；卖家越多，买家体验越好。两条反向箭头构成正向反馈循环，即交叉网络效应。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">交叉网络效应：两边相互增强</text>
<rect x="80" y="150" width="260" height="140" rx="12" fill="#ecf3f1" stroke="#147f80" stroke-width="2"/><text x="210" y="205" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#147f80" text-anchor="middle" font-weight="700">买家侧 A</text><text x="210" y="235" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#5c7074" text-anchor="middle">价格弹性较高</text><text x="210" y="258" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#5c7074" text-anchor="middle">人数越多，平台对卖家越有价值</text>
<rect x="540" y="150" width="260" height="140" rx="12" fill="#fdf1e9" stroke="#d06d4d" stroke-width="2"/><text x="670" y="205" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#d06d4d" text-anchor="middle" font-weight="700">卖家侧 B</text><text x="670" y="235" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#5c7074" text-anchor="middle">供给越丰富</text><text x="670" y="258" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#5c7074" text-anchor="middle">商品越多，买家体验越好</text>
<path d="M340,150 Q440,80 540,150" fill="none" stroke="#147f80" stroke-width="2.6"/><polygon points="540,150 526,146 529,158" fill="#147f80"/><text x="440" y="72" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" text-anchor="middle" font-weight="700">买家越多 → 卖家越愿入驻</text>
<path d="M540,290 Q440,360 340,290" fill="none" stroke="#d06d4d" stroke-width="2.6"/><polygon points="340,290 354,286 351,298" fill="#d06d4d"/><text x="440" y="382" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#d06d4d" text-anchor="middle" font-weight="700">卖家越多 → 买家体验越好</text>
<text x="440" y="225" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#7461ba" text-anchor="middle" font-weight="700">交叉</text><text x="440" y="247" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#7461ba" text-anchor="middle" font-weight="700">网络效应</text>
<text x="440" y="430" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">双边相互增强，形成正向反馈循环（概念示意）</text></svg>
