<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c27a-title c27a-desc"><title id="c27a-title">算法定价的两条路径</title><desc id="c27a-desc">概念图：两个相互观察对方价格的定价算法，若各自持续降价，价格滑向边际成本；若相互跟随，高价可以维持。纵轴为价格，横轴为时间，数值为教学示意。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">算法定价：相互降价还是相互跟随（教学示意）</text>
<line x1="110" y1="410" x2="820" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="70" x2="110" y2="410" stroke="#24373b" stroke-width="2"/>
<line x1="110" y1="353.3" x2="820" y2="353.3" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="110" y1="126.7" x2="800" y2="126.7" stroke="#147f80" stroke-width="3.5"/><text x="700" y="118" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#147f80" font-weight="700">相互跟随：高价维持</text>
<polyline fill="none" stroke="#d06d4d" stroke-width="3.5" points="110,126.7 248,183.3 386,240 524,296.7 662,339.2 800,353.3"/><text x="500" y="250" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#d06d4d" font-weight="700">相互降价：滑向边际成本</text>
<circle cx="110" cy="126.7" r="6" fill="#fffefa" stroke="#7461ba" stroke-width="3"/>
<text x="104" y="130" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">100</text><text x="104" y="357" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">20</text><text x="150" y="340" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#617479" text-anchor="start">边际成本</text>
<text x="800" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">时间</text><text x="465" y="452" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">价格（教学示意）</text></svg>
