<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c27b-title c27b-desc"><title id="c27b-title">统一定价与个性化定价</title><desc id="c27b-desc">教学示意：需求 P=12−Q、边际成本为 0。统一定价时企业取 P=6、Q=6，利润为青色矩形，消费者剩余为上方三角形；个性化定价理论上可按每人支付意愿收费，攫取整个三角形下的总剩余。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">统一定价 vs 个性化定价（教学示例，P=12−Q，MC=0）</text>
<polygon points="110,70 800,410 110,410" fill="#f3eef8" opacity="0.7"/><polygon points="110,70 110,240 455,240" fill="#dcefec"/><polygon points="110,240 455,240 455,410 110,410" fill="#147f80" opacity="0.35"/>
<line x1="110" y1="410" x2="820" y2="410" stroke="#24373b" stroke-width="2"/><line x1="110" y1="70" x2="110" y2="410" stroke="#24373b" stroke-width="2"/>
<line x1="110" y1="70" x2="800" y2="410" stroke="#147f80" stroke-width="3.5"/><line x1="110" y1="240" x2="455" y2="240" stroke="#d06d4d" stroke-width="3"/>
<line x1="455" y1="240" x2="455" y2="410" stroke="#9aa9a6" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="330" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#0e6668" text-anchor="middle" font-weight="700">统一定价的利润</text><text x="250" y="175" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#0e6668" text-anchor="middle" font-weight="700">统一定价下的消费者剩余</text>
<text x="700" y="250" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13.5" fill="#7461ba" text-anchor="middle" font-weight="700">个性化定价可攫取的总剩余</text>
<text x="104" y="245" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#d06d4d" text-anchor="end">6</text><text x="104" y="410" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">0</text><text x="104" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="end">12</text>
<text x="455" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">Q=6</text><text x="800" y="432" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#617479" text-anchor="middle">12</text><text x="800" y="80" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#147f80" text-anchor="end" font-weight="700">需求 P=12−Q</text>
<text x="440" y="458" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074" text-anchor="middle">数量 Q；价格 P（教学示例）</text></svg>
