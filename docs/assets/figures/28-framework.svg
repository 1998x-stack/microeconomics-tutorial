<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c28a-title c28a-desc"><title id="c28a-title">微观经济学五步分析框架</title><desc id="c28a-desc">流程图：识别市场与参与者、判断市场结构、选择适用模型、分析均衡与效率、评估政策选项，五个步骤自上而下依次进行。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">五步分析框架：从定义问题到政策建议</text>
<rect x="150" y="54" width="580" height="62" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.8"/><text x="172" y="82" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#0e6668" font-weight="700">① 识别市场与参与者</text><text x="172" y="104" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">谁是买方、卖方？市场边界在哪里？有没有第三方受影响？</text>
<rect x="150" y="134" width="580" height="62" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.8"/><text x="172" y="162" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#0e6668" font-weight="700">② 判断市场结构</text><text x="172" y="184" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">市场是竞争的吗？谁有市场势力？信息对称吗？</text>
<rect x="150" y="214" width="580" height="62" rx="10" fill="#fdf1e9" stroke="#d06d4d" stroke-width="1.8"/><text x="172" y="242" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#a24c30" font-weight="700">③ 选择适用模型</text><text x="172" y="264" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">供需 / 博弈 / 外部性 / 信息 / 行为 / 平台？</text>
<rect x="150" y="294" width="580" height="62" rx="10" fill="#fdf1e9" stroke="#d06d4d" stroke-width="1.8"/><text x="172" y="322" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#a24c30" font-weight="700">④ 分析均衡与效率</text><text x="172" y="344" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">当前均衡是什么？有效率吗？消费者与生产者剩余各多少？</text>
<rect x="150" y="374" width="580" height="62" rx="10" fill="#f0edf8" stroke="#7461ba" stroke-width="1.8"/><text x="172" y="402" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14.5" fill="#7461ba" font-weight="700">⑤ 评估政策选项</text><text x="172" y="424" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">需要干预吗？哪种工具最优？效率与公平的权衡是什么？</text>
<line x1="440" y1="116" x2="440" y2="134" stroke="#9aa9a6" stroke-width="2"/><line x1="440" y1="196" x2="440" y2="214" stroke="#9aa9a6" stroke-width="2"/><line x1="440" y1="276" x2="440" y2="294" stroke="#9aa9a6" stroke-width="2"/><line x1="440" y1="356" x2="440" y2="374" stroke="#9aa9a6" stroke-width="2"/>
<text x="756" y="438" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5c7074" text-anchor="middle">Step 1–2 最易被跳过</text></svg>
