<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="c28b-title c28b-desc"><title id="c28b-title">按问题特征选择模型</title><desc id="c28b-desc">六张参考卡片：供需模型对应价格与数量趋势，博弈论对应少数企业策略互动，外部性对应未定价的相互影响，信息不对称对应一方知道更多，行为经济学对应心理因素，平台经济学对应多边市场与网络效应。</desc><rect width="880" height="470" fill="#fffefa"/><text x="36" y="30" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" fill="#24373b" font-weight="700">Step 3 · 按问题特征匹配模型</text>
<rect x="30" y="60" width="260" height="180" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.6"/><text x="48" y="90" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#0e6668" font-weight="700">供需模型</text><text x="48" y="118" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">价格与数量的总体趋势</text><text x="48" y="142" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">（如加税对房价的影响）</text><text x="48" y="222" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#147f80">第 3–7 章</text>
<rect x="310" y="60" width="260" height="180" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.6"/><text x="328" y="90" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#0e6668" font-weight="700">博弈论</text><text x="328" y="118" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">少数企业的策略互动</text><text x="328" y="142" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">（如两家航司是否扩产）</text><text x="328" y="222" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#147f80">第 17–18 章</text>
<rect x="590" y="60" width="260" height="180" rx="10" fill="#ecf3f1" stroke="#147f80" stroke-width="1.6"/><text x="608" y="90" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#0e6668" font-weight="700">外部性</text><text x="608" y="118" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">相互影响却未被定价</text><text x="608" y="142" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">（如工厂排污与碳排放）</text><text x="608" y="222" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#147f80">第 19–20 章</text>
<rect x="30" y="252" width="260" height="180" rx="10" fill="#fdf1e9" stroke="#d06d4d" stroke-width="1.6"/><text x="48" y="282" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#a24c30" font-weight="700">信息不对称</text><text x="48" y="310" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">一方比另一方知道更多</text><text x="48" y="334" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">（如二手车市场失灵）</text><text x="48" y="414" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#d06d4d">第 21 章</text>
<rect x="310" y="252" width="260" height="180" rx="10" fill="#fdf1e9" stroke="#d06d4d" stroke-width="1.6"/><text x="328" y="282" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#a24c30" font-weight="700">行为经济学</text><text x="328" y="310" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">心理因素影响决策</text><text x="328" y="334" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">（如养老金储蓄不足）</text><text x="328" y="414" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#d06d4d">第 24–25 章</text>
<rect x="590" y="252" width="260" height="180" rx="10" fill="#f0edf8" stroke="#7461ba" stroke-width="1.6"/><text x="608" y="282" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#7461ba" font-weight="700">平台经济学</text><text x="608" y="310" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">多边市场与网络效应</text><text x="608" y="334" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#5c7074">（如补贴司机还是乘客）</text><text x="608" y="414" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12.5" fill="#7461ba">第 26–27 章</text></svg>
