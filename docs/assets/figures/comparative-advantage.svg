<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ca-title ca-desc" viewBox="0 0 880 450" width="880" height="450"><title id="ca-title">比较优势与贸易条件</title><desc id="ca-desc">甲每小时4苹果或2米布，乙每小时3苹果或1米布。甲1米布牺牲2苹果，乙牺牲3苹果，交易价2.5苹果可以双方获益。</desc><rect width="880" height="450" fill="#fffefa"/><text x="40" y="39" fill="#24373b" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">即使甲在两种产品上都更高产，也可能互利交换</text><rect x="50" y="72" width="370" height="246" fill="#f2f7f5" rx="10"/><text x="74" y="110" fill="#24373b" font-size="19" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">甲：每小时最大产量</text><text x="74" y="179" fill="#147f80" font-size="27" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">4 个苹果</text><text x="265" y="179" fill="#147f80" font-size="27" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">2 米布</text><line x1="72" y1="204" x2="397" y2="204" stroke="#dce5e2" stroke-width="2" /><text x="74" y="249" fill="#24373b" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">机会成本：1 米布 ⇔ 2 苹果</text><text x="74" y="290" fill="#147f80" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">比较优势：布</text><rect x="461" y="72" width="370" height="246" fill="#f2f7f5" rx="10"/><text x="485" y="110" fill="#24373b" font-size="19" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">乙：每小时最大产量</text><text x="485" y="179" fill="#d06d4d" font-size="27" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">3 个苹果</text><text x="676" y="179" fill="#d06d4d" font-size="27" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">1 米布</text><line x1="483" y1="204" x2="808" y2="204" stroke="#dce5e2" stroke-width="2" /><text x="485" y="249" fill="#24373b" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">机会成本：1 米布 ⇔ 3 苹果</text><text x="485" y="290" fill="#d06d4d" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">比较优势：苹果</text><rect x="189" y="339" width="500" height="75" fill="#edf2ef" rx="10"/><text x="438" y="369" fill="#7461ba" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">可议价区间：2 &lt; 交易价格 &lt; 3</text><text x="438" y="395" fill="#24373b" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">例如：1 米布 ⇄ 2.5 个苹果</text></svg>