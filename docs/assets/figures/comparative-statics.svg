<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="statics-title statics-desc" viewBox="0 0 880 450" width="880" height="450"><title id="statics-title">比较静态的三种均衡</title><desc id="statics-desc">需求右移20均衡P24Q92，供给右移20均衡P16Q88，同时右移20均衡P20Q100。</desc><rect width="880" height="450" fill="#fffefa"/><text x="35" y="39" fill="#24373b" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">同一市场的三种冲击：旧均衡（灰）与新均衡（紫）</text><rect x="16" y="70" width="258" height="310" fill="#f3f7f5" rx="10"/><text x="33" y="102" fill="#24373b" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">需求 +20</text><line x1="38" y1="333" x2="246" y2="333" stroke="#24373b" stroke-width="2" /><line x1="38" y1="333" x2="38" y2="122" stroke="#24373b" stroke-width="2" /><polyline points="92,133 200,333" fill="none" stroke="#aacbc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polyline points="65,333 227,133" fill="none" stroke="#ecc5b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polyline points="119,133 227,333" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polyline points="65,333 227,133" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="146" cy="233" r="7" fill="#fff" stroke="#aaa" stroke-width="3"/><circle cx="162.2" cy="213" r="7" fill="#fff" stroke="#7461ba" stroke-width="3"/><text x="143" y="366" fill="#7461ba" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">P = 24，Q = 92</text><rect x="310" y="70" width="258" height="310" fill="#f3f7f5" rx="10"/><text x="327" y="102" fill="#24373b" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">供给 +20</text><line x1="332" y1="333" x2="540" y2="333" stroke="#24373b" stroke-width="2" /><line x1="332" y1="333" x2="332" y2="122" stroke="#24373b" stroke-width="2" /><polyline points="386,133 494,333" fill="none" stroke="#aacbc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polyline points="359,333 521,133" fill="none" stroke="#ecc5b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polyline points="386,133 494,333" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polyline points="386,333 548,133" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="440" cy="233" r="7" fill="#fff" stroke="#aaa" stroke-width="3"/><circle cx="450.8" cy="253" r="7" fill="#fff" stroke="#7461ba" stroke-width="3"/><text x="437" y="366" fill="#7461ba" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">P = 16，Q = 88</text><rect x="604" y="70" width="258" height="310" fill="#f3f7f5" rx="10"/><text x="621" y="102" fill="#24373b" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">两者各 +20</text><line x1="626" y1="333" x2="834" y2="333" stroke="#24373b" stroke-width="2" /><line x1="626" y1="333" x2="626" y2="122" stroke="#24373b" stroke-width="2" /><polyline points="680,133 788,333" fill="none" stroke="#aacbc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polyline points="653,333 815,133" fill="none" stroke="#ecc5b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polyline points="707,133 815,333" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polyline points="680,333 842,133" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="734" cy="233" r="7" fill="#fff" stroke="#aaa" stroke-width="3"/><circle cx="761" cy="233" r="7" fill="#fff" stroke="#7461ba" stroke-width="3"/><text x="731" y="366" fill="#7461ba" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">P = 20，Q = 100</text><text x="440" y="427" fill="#597176" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">只看方向无法确定两种冲击同时发生时的最终价格。</text></svg>