<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dshift-title dshift-desc" viewBox="0 0 880 450" width="880" height="450"><title id="dshift-title">沿需求移动与需求平移</title><desc id="dshift-desc">原需求Q等于120减2P，在价格30时60件，价格20时80件；右移20后的新需求在价格20时100件。</desc><rect width="880" height="450" fill="#fffefa"/><text x="48" y="39" fill="#24373b" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">沿需求曲线移动 ≠ 需求曲线整体移动</text><line x1="105" y1="358" x2="783" y2="358" stroke="#24373b" stroke-width="2" /><line x1="105" y1="358" x2="105" y2="68" stroke="#24373b" stroke-width="2" /><line x1="105" y1="286.5" x2="780" y2="286.5" stroke="#e6efec" stroke-width="1" /><text x="83" y="291.5" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">10</text><line x1="105" y1="215" x2="780" y2="215" stroke="#e6efec" stroke-width="1" /><text x="83" y="220" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">20</text><line x1="105" y1="143.5" x2="780" y2="143.5" stroke="#e6efec" stroke-width="1" /><text x="83" y="148.5" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">30</text><line x1="105" y1="72" x2="780" y2="72" stroke="#e6efec" stroke-width="1" /><text x="83" y="77" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">40</text><text x="778" y="403" fill="#597176" font-size="15" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">数量 Q（件）</text><text x="108" y="62" fill="#597176" font-size="15" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">价格 P（元）</text><polyline points="285,72 645,358" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polyline points="375,72 735,358" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 7"/><circle cx="375" cy="143.5" r="7" fill="#fff" stroke="#147f80" stroke-width="3"/><circle cx="465" cy="215" r="7" fill="#fff" stroke="#147f80" stroke-width="3"/><circle cx="555" cy="215" r="7" fill="#fff" stroke="#7461ba" stroke-width="3"/><line x1="465" y1="215" x2="555" y2="215" stroke="#7461ba" stroke-width="2" stroke-dasharray="5 4"/><text x="335" y="112" fill="#147f80" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">D₀: Q = 120 − 2P</text><text x="568" y="160" fill="#7461ba" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">D₁: Q = 140 − 2P</text><text x="455" y="424" fill="#597176" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">自身价格下降：60 → 80；同价的偏好改变：80 → 100</text></svg>