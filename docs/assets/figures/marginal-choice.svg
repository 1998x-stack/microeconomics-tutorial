t x="527" y="238.25" width="48" height="114.74999999999999" fill="#d06d4d" rx="4"/><text x="496" y="215.5" fill="#147f80" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">50</text><text x="551" y="228.25" fill="#d06d4d" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">45</text><text x="522" y="385" fill="#24373b" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第3单位</text><text x="522" y="416" fill="#147f80" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">值得 √</text><rect x="642" y="276.5" width="48" height="76.5" fill="#147f80" rx="4"/><rect x="697" y="212.75" width="48" height="140.25" fill="#d06d4d" rx="4"/><text x="666" y="266.5" fill="#147f80" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">30</text><text x="721" y="202.75" fill="#d06d4d" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">55</text><text x="692" y="385" fill="#24373b" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第4单位</text><text x="692" y="416" fill="#d06d4d" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">应停止 ×</text><rect x="539" y="53" width="16" height="16" fill="#147f80" rx="2"/><text x="562" y="68" fill="#24373b" font-size="14" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">边际收益 MB</text><rect x="695" y="53" width="16" height="16" fill="#d06d4d" rx="2"/><text x="715" y="68" fill="#24373b" font-size="14" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">边际成本 MC</text></svg>