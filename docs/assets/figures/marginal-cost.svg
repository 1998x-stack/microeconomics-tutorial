<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mccurve-title mccurve-desc" viewBox="0 0 880 450" width="880" height="450"><title id="mccurve-title">边际成本与产量</title><desc id="mccurve-desc">五个单位边际成本为3、5、7、10、13元，价格8元时选择生产前三单位。</desc><rect width="880" height="450" fill="#fffefa"/><text x="43" y="37" fill="#24373b" font-size="21" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">在价格 8 元下，哪些边际单位值得生产？</text><line x1="90" y1="353" x2="790" y2="353" stroke="#24373b" stroke-width="2" /><rect x="125" y="296" width="80" height="57" fill="#147f80" rx="5"/><text x="165" y="286" fill="#147f80" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">MC 3</text><text x="165" y="385" fill="#24373b" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第1单位</text><rect x="252" y="258" width="80" height="95" fill="#147f80" rx="5"/><text x="292" y="248" fill="#147f80" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">MC 5</text><text x="292" y="385" fill="#24373b" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第2单位</text><rect x="379" y="220" width="80" height="133" fill="#147f80" rx="5"/><text x="419" y="210" fill="#147f80" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">MC 7</text><text x="419" y="385" fill="#24373b" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第3单位</text><rect x="506" y="163" width="80" height="190" fill="#d06d4d" rx="5"/><text x="546" y="153" fill="#d06d4d" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">MC 10</text><text x="546" y="385" fill="#24373b" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第4单位</text><rect x="633" y="106" width="80" height="247" fill="#d06d4d" rx="5"/><text x="673" y="96" fill="#d06d4d" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">MC 13</text><text x="673" y="385" fill="#24373b" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第5单位</text><line x1="100" y1="201" x2="778" y2="201" stroke="#7461ba" stroke-width="3" stroke-dasharray="7 6"/><text x="781" y="189" fill="#7461ba" font-size="16" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">P=8</text><text x="437" y="424" fill="#597176" font-size="15" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">第 1–3 单位边际成本低于价格；第 4 单位应停止。</text></svg>