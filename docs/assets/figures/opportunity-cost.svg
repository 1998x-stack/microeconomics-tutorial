<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oc-title oc-desc" viewBox="0 0 880 450" width="880" height="450"><title id="oc-title">一个小时的三种用途</title><desc id="oc-desc">学习净价值80、休息100、兼职120。如果选择学习，机会成本是未选最佳的120，而非220。</desc><rect width="880" height="450" fill="#fffefa"/><text x="44" y="40" fill="#24373b" font-size="22" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">一小时的三种互斥用途</text><rect x="65" y="88" width="215" height="267" fill="#f2f7f5" rx="10"/><rect x="113" y="204" width="118" height="124" fill="#147f80" rx="6"/><text x="172" y="123" fill="#24373b" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">学习</text><text x="172" y="193" fill="#147f80" font-size="24" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">80</text><rect x="330" y="88" width="215" height="267" fill="#f2f7f5" rx="10"/><rect x="378" y="173" width="118" height="155" fill="#996d25" rx="6"/><text x="437" y="123" fill="#24373b" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">休息</text><text x="437" y="162" fill="#996d25" font-size="24" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">100</text><rect x="595" y="88" width="215" height="267" fill="#f2f7f5" rx="10"/><rect x="643" y="142" width="118" height="186" fill="#7461ba" rx="6"/><text x="702" y="123" fill="#24373b" font-size="20" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">兼职</text><text x="702" y="131" fill="#7461ba" font-size="24" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">120</text><text x="438" y="389" fill="#147f80" font-size="19" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">若选择学习，机会成本是最佳未选项：兼职 120</text><text x="438" y="419" fill="#597176" font-size="14" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">数值是示意的可比净价值，不是现实中已测量的效用。</text></svg>