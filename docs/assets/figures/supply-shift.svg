<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sshift-title sshift-desc" viewBox="0 0 880 450" width="880" height="450"><title id="sshift-title">供给曲线整体右移</title><desc id="sshift-desc">原供给Q等于20加3P，新的供给Q等于40加3P，价格20元供给从80增加到100。</desc><rect width="880" height="450" fill="#fffefa"/><text x="48" y="39" fill="#24373b" font-size="20" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">生产成本下降，让同一价格下的供给增加</text><line x1="105" y1="358" x2="783" y2="358" stroke="#24373b" stroke-width="2" /><line x1="105" y1="358" x2="105" y2="68" stroke="#24373b" stroke-width="2" /><line x1="105" y1="286.5" x2="780" y2="286.5" stroke="#e6efec" stroke-width="1" /><text x="83" y="291.5" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">10</text><line x1="105" y1="215" x2="780" y2="215" stroke="#e6efec" stroke-width="1" /><text x="83" y="220" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">20</text><line x1="105" y1="143.5" x2="780" y2="143.5" stroke="#e6efec" stroke-width="1" /><text x="83" y="148.5" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">30</text><line x1="105" y1="72" x2="780" y2="72" stroke="#e6efec" stroke-width="1" /><text x="83" y="77" fill="#597176" font-size="13" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">40</text><text x="778" y="403" fill="#597176" font-size="15" text-anchor="end" font-family="Arial,Microsoft YaHei,sans-serif">数量 Q（件）</text><text x="108" y="62" fill="#597176" font-size="15" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">价格 P（元）</text><polyline points="195,358 735,72" fill="none" stroke="#d06d4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polyline points="285,358 825,72" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 7"/><circle cx="465" cy="215" r="7" fill="#fff" stroke="#d06d4d" stroke-width="3"/><circle cx="555" cy="215" r="7" fill="#fff" stroke="#7461ba" stroke-width="3"/><line x1="465" y1="215" x2="555" y2="215" stroke="#7461ba" stroke-width="3" stroke-dasharray="6 6"/><text x="208" y="125" fill="#d06d4d" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">S₀: Q = 20 + 3P</text><text x="535" y="110" fill="#7461ba" font-size="17" text-anchor="start" font-family="Arial,Microsoft YaHei,sans-serif">S₁: Q = 40 + 3P</text><text x="445" y="423" fill="#597176" font-size="16" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif">价格 20 元时，数量从 80 增至 100</text></svg>